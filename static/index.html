<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영포티 판독기 · FORTY-SCAN</title>
<!--OG-->

<!-- 브라우저 탭 아이콘. 파일을 따로 두지 않으려고 SVG 를 그대로 넣었습니다.
     (없으면 /favicon.ico 요청이 404 로 찍힙니다.) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23158F69'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='14' font-weight='bold' fill='%23fff' text-anchor='middle'%3EFS%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">

<style>
/* ==========================================================
   영포티 판독기 화면

   디자인은 아래 두 시안을 그대로 옮긴 것입니다.

     static/forty_scan_web_wireframe.html    (웹  640px 프레임)
     static/forty_scan_wireframe_board.html  (모바일 300x560 프레임)

   한 파일로 두 시안을 모두 커버합니다.
   600px 아래에서 모바일 시안 레이아웃으로 바뀝니다.
   ========================================================== */

:root {
  --cream: #FAFAF0;
  --page: #F5EFE0;
  --green: #158F69;
  --green-dk: #158F69;
  --green-tint: rgba(21,143,105,0.09);
  --yellow: #FEC926;
  --yellow-tint: rgba(254,201,38,0.20);
  --ink: #3d3627;
  --muted: #a89a7a;
  --white: #ffffff;
  --line: #ecdfc0;
  --track: #dcece4;
  --gray: #b3ab97;

  --dur: .22s;
}

* { box-sizing: border-box; }

html { height: 100%; }

/* body 에 height:100% 를 주면 안 됩니다.
   내용이 화면보다 길어졌을 때 align-items:center 가
   프레임 위쪽을 화면 밖으로 밀어내서 잘립니다. */

body {
  min-height: 100%;
  margin: 0;
  padding: 40px 20px;
  background: var(--page);
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }

/* ---------------- 프레임 ---------------- */

.frame {
  position: relative;
  width: 100%;
  max-width: 640px;
  min-height: 600px;
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 56px 40px 32px;
  display: flex;
  flex-direction: column;
}
/* .frame 에 overflow:hidden 을 걸면
   내용이 화면보다 길어졌을 때(근거 아코디언을 펼친 결과 화면 등)
   가운데 정렬 때문에 위쪽이 잘려서 못 보게 됩니다.
   컨페티는 .confetti 가 스스로 잘라내므로 여기서는 필요 없습니다. */

.logo-badge {
  position: absolute; top: 14px; left: 18px; z-index: 3;
  width: 26px; height: 26px; border-radius: 8px;
  background: transparent; color: #fff;
  font-size: 9px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  border: none; cursor: pointer; overflow: hidden; padding: 0;
  transition: transform .12s ease, filter .12s ease;
}
.logo-badge img { width: 100%; height: 100%; object-fit: cover; display: block; }
.logo-badge:hover { filter: brightness(1.08); }
.logo-badge:active { transform: scale(.92); }

.back-web {
  position: absolute; top: 14px; right: 20px; z-index: 3;
  background: var(--white);
  border: 1.5px solid var(--green);
  color: var(--green);
  font-size: 12px; font-weight: 800;
  padding: 6px 13px;
  border-radius: 999px;
  transition: transform .12s ease, background .12s ease;
}
.back-web:hover { background: var(--green-tint); }
.back-web:active { transform: scale(.95); }
.back-web[hidden] { display: none; }

/* ---------------- 화면 전환 ---------------- */

.screen { display: none; }

.screen.is-active {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  animation: screenIn var(--dur) ease both;
}

@keyframes screenIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

/* ---------------- 공통 타이포 ---------------- */

.headline { font-size: 22px; font-weight: 800; color: var(--green-dk); text-align: center; line-height: 1.4; }
.sub-min { font-size: 13px; color: var(--muted); text-align: center; }
.tiny-link { font-size: 13px; color: var(--muted); text-decoration: none; }
.tiny-link:hover { color: var(--green); }

.stk, .headline, .pill-btn, .round-btn, .opt-tile .lb, .gauge-grade, .mini-name, .score-num {
  font-family: "Black Han Sans", "Pretendard", "Malgun Gothic", sans-serif;
  font-weight: 400;
}

/* ---------------- 버튼 ---------------- */

.pill-btn {
  width: 220px; height: 48px;
  background: var(--green); color: #fff;
  border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  transition: transform .12s ease, box-shadow .2s ease, background .15s ease;
  box-shadow: 0 4px 0 rgba(21,143,105,.22);
}
.pill-btn:hover { box-shadow: 0 6px 14px rgba(21,143,105,.26); }
.pill-btn:active { transform: translateY(2px) scale(.98); box-shadow: 0 1px 0 rgba(21,143,105,.22); }

.pill-btn.ghost {
  background: var(--white); color: var(--green);
  border: 1.5px solid var(--green);
  box-shadow: none;
}
.pill-btn.ghost:hover { background: var(--green-tint); }

.round-btn {
  width: 140px; height: 140px;
  background: var(--green); color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  box-shadow: 0 6px 0 rgba(21,143,105,.22);
  transition: transform .12s ease, box-shadow .2s ease;
}
.round-btn:hover { box-shadow: 0 10px 20px rgba(21,143,105,.28); }
.round-btn:active { transform: translateY(3px) scale(.98); box-shadow: 0 2px 0 rgba(21,143,105,.22); }

.btn-row { display: flex; gap: 10px; width: 100%; max-width: 380px; }
.btn-row .pill-btn { flex: 1; width: auto; }

/* ---------------- 정사각 중심 영역 ---------------- */

.square {
  width: 380px; max-width: 100%;
  height: 380px;
  background: var(--green-tint);
  border-radius: 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  overflow: hidden;
}
.square .mark { font-size: 40px; }
.square .cap { font-size: 13px; color: #7fae9c; }

/* 랜딩 키아트 */

/* keyart.png 은 시안의 랜딩 이미지에서 투명 여백을 잘라낸 것입니다.
   원본 해상도가 359px 라서 그보다 크게 늘리면 흐려집니다. */
.keyart {
  width: 100%; max-width: 360px;
  display: block;
  animation: popIn .5s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(.88) translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.landing-spacer { flex: 1; min-height: 8px; }

/* ---------------- 선택 타일 ---------------- */

.opt-wrap {
  width: 380px; max-width: 100%;
  display: flex; flex-direction: column; gap: 12px;
  flex: 1;
}

.opt-tile {
  width: 100%; flex: 1; min-height: 120px;
  background: var(--green-tint);
  border-radius: 20px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
  transition: transform .14s ease, background .14s ease, box-shadow .2s ease;
}
.opt-tile:hover { background: rgba(21,143,105,.15); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(21,143,105,.13); }
.opt-tile:active { transform: translateY(0) scale(.99); }
.opt-tile .mark { font-size: 30px; }
.opt-tile .lb { font-size: 16px; color: var(--green-dk); }
.opt-tile .cap { font-size: 12px; color: #7fae9c; }

.intent-grid {
  width: 560px; max-width: 100%;
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-rows: 1fr;
  gap: 16px;
}
.intent-grid .full { grid-column: 1 / 3; }
.intent-grid .opt-tile { border-radius: 28px; }

/* ---------------- 드롭존 ---------------- */

.drop {
  width: 380px; max-width: 100%;
  height: 380px;
  background: var(--green-tint);
  border: 2px dashed transparent;
  border-radius: 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  transition: background .15s ease, border-color .15s ease, transform .15s ease;
}
.drop .mark { font-size: 40px; color: var(--green); transition: transform .2s ease; }
.drop .cap { font-size: 13px; color: #7fae9c; }
.drop:hover { border-color: rgba(21,143,105,.35); }
.drop.hot {
  background: var(--yellow-tint);
  border-color: var(--green);
  transform: scale(1.02);
}
.drop.hot .mark { transform: scale(1.25) rotate(90deg); }

.file-name { font-size: 12px; color: var(--green); font-weight: 700; }

/* ---------------- 문장 입력 ---------------- */

.casual-input {
  width: 320px; max-width: 100%;
  height: 200px;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 22px;
  padding: 18px;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  resize: none;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.casual-input::placeholder { color: var(--muted); }
.casual-input:focus { border-color: var(--green); box-shadow: 0 0 0 4px var(--green-tint); }

/* ---------------- 아바타 ---------------- */

.avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--yellow-tint);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 800; color: var(--green-dk);
  flex-shrink: 0;
  overflow: hidden;
}
.avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 4%;
  display: block;
}
.avatar.lg { width: 84px; height: 84px; font-size: 34px; }
.avatar.dim img { filter: grayscale(1); opacity: .55; }

.who-grid {
  display: flex; flex-wrap: wrap; gap: 28px;
  align-items: flex-start; justify-content: center;
  padding: 20px;
  max-height: 100%;
  overflow-y: auto;
}
.who-item {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  width: 96px;
  transition: transform .14s ease;
}
.who-item:hover { transform: translateY(-3px); }
.who-item:hover .avatar { background: var(--yellow); }
.who-item .nm { font-size: 12px; color: var(--muted); text-align: center; word-break: break-all; line-height: 1.3; }

/* ---------------- 로딩 ---------------- */

.loading-char {
  width: 190px; height: 260px;
  object-fit: contain;
  object-position: bottom;
  animation: bobble 1.6s ease-in-out infinite;
}
@keyframes bobble {
  0%, 100% { transform: translateY(0) rotate(-1.5deg); }
  50%      { transform: translateY(-12px) rotate(1.5deg); }
}

.loading-copy {
  font-size: 18px;
  min-height: 26px;
  transition: opacity .25s ease, transform .25s ease;
}
.loading-copy.fade { opacity: 0; transform: translateY(6px); }

.dots { display: flex; gap: 6px; }
.dots i {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--yellow);
  animation: dot 1s ease-in-out infinite;
}
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot {
  0%, 100% { transform: translateY(0); opacity: .45; }
  50%      { transform: translateY(-6px); opacity: 1; }
}

/* ---------------- 결과: 캐릭터 무대 ---------------- */

.stage {
  position: relative;
  width: 380px; max-width: 100%;
  height: 300px;
  background: var(--green-tint);
  border-radius: 28px;
  overflow: hidden;
  flex-shrink: 0;
}

.stage-glow {
  position: absolute; left: 50%; top: 50%;
  width: 300px; height: 300px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, var(--yellow-tint) 0%, rgba(254,201,38,0) 68%);
  animation: pulseGlow 3.4s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: .85; }
  50%      { transform: translate(-50%,-50%) scale(1.12); opacity: 1; }
}

.stage-floor {
  position: absolute; left: 50%; bottom: 22px;
  width: 190px; height: 16px;
  transform: translateX(-50%);
  background: rgba(21,143,105,.13);
  border-radius: 50%;
  filter: blur(3px);
}

.stage .char {
  position: absolute; left: 50%; bottom: 14px;
  /* 무대 높이에 맞춥니다. 고정값으로 두면
     순위 화면처럼 낮은 무대에서 머리가 잘립니다. */
  height: calc(100% - 26px);
  transform: translateX(-50%);
  object-fit: contain;
  object-position: bottom;
  opacity: 0;
  transition: opacity .35s ease;
}
.stage .char.in {
  opacity: 1;
  animation: charIn .55s cubic-bezier(.2,.9,.3,1.3) both, float 3.6s ease-in-out 0.6s infinite;
}
@keyframes charIn {
  from { opacity: 0; transform: translateX(-50%) translateY(26px) scale(.86); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}
@keyframes float {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50%      { transform: translateX(-50%) translateY(-9px); }
}
.stage.dim .char { filter: grayscale(1); opacity: .6; }
.stage.dim .stage-glow { display: none; }

.stage-tag {
  position: absolute; top: 14px; left: 14px;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 11px; font-weight: 800; color: var(--muted);
}

/* ---------------- 결과: 게이지 ---------------- */

.gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }

.gauge { width: 240px; max-width: 100%; display: block; margin-bottom: -14px; }
.gauge .arc-fill {
  transition: stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);
}
.score-num { font-size: 34px; }

.gauge-grade { font-size: 22px; color: var(--green-dk); }
.gauge-grade.prov { color: var(--gray); }
.gauge-sub { font-size: 13px; color: var(--muted); text-align: center; }
.gauge-meta { font-size: 11px; color: var(--muted); }

.prov-badge {
  display: inline-block;
  background: var(--yellow-tint);
  color: #8a7a4a;
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 11px; font-weight: 800;
}

/* ---------------- 순위 ---------------- */

.rank-list {
  width: 380px; max-width: 100%;
  display: flex; flex-direction: column; gap: 12px;
  flex: 1; justify-content: center;
  padding: 4px 0;
}

.mini-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  padding: 4px;
  border-radius: 14px;
  text-align: left;
  transition: background .14s ease, transform .14s ease;
  animation: rowIn .4s ease both;
}
.mini-row:hover { background: var(--green-tint); transform: translateX(2px); }
@keyframes rowIn {
  from { opacity: 0; transform: translateX(-10px); }
  to   { opacity: 1; transform: none; }
}
.mini-name {
  font-size: 15px; color: var(--green-dk);
  width: 76px; flex-shrink: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mini-bar-track { flex: 1; height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; }
.mini-bar-fill {
  display: block;   /* span 이라서 이게 없으면 width / height 가 먹지 않습니다. */
  height: 100%; width: 0;
  background: linear-gradient(90deg, var(--yellow), var(--green));
  border-radius: 999px;
  transition: width .8s cubic-bezier(.2,.8,.2,1);
}
.mini-bar-fill.prov { background: var(--gray); }
.mini-score { font-size: 14px; color: var(--muted); width: 30px; text-align: right; flex-shrink: 0; }
.mini-rank { font-size: 12px; color: var(--muted); width: 16px; flex-shrink: 0; text-align: center; }

/* ---------------- 아코디언 ---------------- */

.accordion {
  width: 380px; max-width: 100%;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--white);
  overflow: hidden;
}
.accordion > summary {
  list-style: none;
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; color: var(--muted);
  cursor: pointer;
}
.accordion > summary::-webkit-details-marker { display: none; }
.accordion > summary::after {
  content: "⌄";
  color: var(--yellow);
  font-size: 15px;
  transition: transform .2s ease;
}
.accordion[open] > summary::after { transform: rotate(180deg); }
.accordion .acc-body {
  padding: 4px 16px 16px;
  animation: screenIn .2s ease both;
}

[data-screen="result-sentence"] .accordion,
[data-screen="result-speaker"] .accordion {
  border-color: var(--green);
}
[data-screen="result-sentence"] .accordion > summary,
[data-screen="result-speaker"] .accordion > summary {
  color: var(--green);
}

.acc-title { font-size: 11px; font-weight: 800; color: var(--green-dk); margin: 10px 0 8px; }

.feat { margin-bottom: 9px; }
.feat-top { display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
.feat-name { color: var(--ink); font-weight: 700; }
.feat-count { color: var(--muted); font-size: 11px; }
.feat-dir { font-size: 10px; font-weight: 800; margin-left: auto; }
.feat-dir.up { color: var(--green); }
.feat-dir.down { color: #c79a1a; }
.feat-track { height: 6px; background: var(--track); border-radius: 999px; margin-top: 4px; overflow: hidden; }
.feat-fill { height: 100%; width: 0; border-radius: 999px; transition: width .7s cubic-bezier(.2,.8,.2,1); }
.feat-fill.up { background: var(--green); }
.feat-fill.down { background: var(--yellow); }

.quote {
  background: var(--green-tint);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 12px;
  line-height: 1.5;
}
.quote .q-score { font-size: 11px; font-weight: 800; color: var(--green); margin-top: 5px; display: block; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: var(--green-tint);
  color: var(--green-dk);
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 11px; font-weight: 700;
}
.chip .n { color: var(--muted); font-weight: 600; }
.chip.fuzzy { background: var(--yellow-tint); color: #8a7a4a; }
.empty-note { font-size: 12px; color: var(--muted); }

/* ---------------- 공유 ---------------- */

.share-icons { display: flex; gap: 14px; }
.icon-circle {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800;
  transition: transform .14s ease, filter .14s ease;
}
.icon-circle:hover { transform: translateY(-3px) scale(1.06); }
.icon-circle:active { transform: scale(.94); }
.icon-circle.kakao { background: #FEE500; color: #391b1b; }
.icon-circle.insta { background: radial-gradient(circle at 30% 110%, #fdf497, #fd5949 40%, #d6249f 60%, #285AEB 90%); color: #fff; }
.icon-circle.fb { background: #1877F2; color: #fff; }
.icon-circle.link { background: var(--green-tint); color: var(--green-dk); }

.overlay {
  position: fixed; inset: 0; z-index: 40;
  display: flex; align-items: center; justify-content: center;
}
.overlay[hidden] { display: none; }
.scrim {
  position: absolute; inset: 0;
  background: rgba(61,54,39,0.35);
  animation: fadeIn .2s ease both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.share-card {
  position: relative;
  width: 340px; max-width: calc(100% - 40px);
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 28px;
  padding: 26px 24px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  animation: cardIn .26s cubic-bezier(.2,.9,.3,1.15) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: scale(.92) translateY(10px); }
  to   { opacity: 1; transform: none; }
}
.share-card .headline { font-size: 19px; }
.share-card .icon-circle { width: 52px; height: 52px; font-size: 15px; }
.sheet-handle { display: none; }

/* ---------------- 토스트 ---------------- */

.toast {
  position: fixed; left: 50%; bottom: 40px; z-index: 60;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--cream);
  border-radius: 999px;
  padding: 12px 22px;
  font-size: 13px; font-weight: 700;
  box-shadow: 0 10px 30px rgba(61,54,39,.28);
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s ease, transform .22s cubic-bezier(.2,.9,.3,1.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------------- 에러 ---------------- */

.err-card {
  width: 380px; max-width: 100%;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 28px 24px;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.err-msg { font-size: 13px; color: var(--ink); line-height: 1.6; word-break: break-word; }

/* ---------------- 컨페티 ---------------- */

.confetti {
  position: absolute; inset: 0; z-index: 20;
  pointer-events: none; overflow: hidden;
}
.confetti i {
  position: absolute; top: -14px;
  width: 9px; height: 14px;
  border-radius: 2px;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(720px) rotate(760deg); opacity: 0; }
}

/* ==========================================================
   모바일 (forty_scan_wireframe_board.html 시안)
   ========================================================== */

@media (max-width: 600px) {

  body { padding: 0; align-items: stretch; }

  .frame {
    max-width: none;
    min-height: 100vh;
    min-height: 100dvh;

     안 그러면 정사각 영역만 늘어나서 텅 빈 초록 상자가 됩니다. */
  .screen.is-active { gap: 14px; justify-content: center; }

  .pill-btn { width: 100%; height: 46px; font-size: 14px; }

  /* 정사각 / 무대 영역은 늘어나되 너무 커지지는 않게 상한을 둡니다. */
  .square, .drop { width: 100%; height: auto; flex: 1; min-height: 160px; max-height: 380px; }
  .keyart { max-width: 78%; }

  .opt-wrap, .rank-list, .accordion, .stage, .err-card { width: 100%; }

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ==========================================================
   0. 상태
   ========================================================== */

const state = {
  file: null,        /* 사용자가 고른 TXT File 객체 */
  all: null,         /* POST /analyze-all 응답 전체 */
  speaker: null,     /* all.results 중 지금 보고 있는 화자 하나 */
  sentence: null,    /* POST /analyze-sentence 응답 */
  intent: null,      /* "me" | "other" | "all" */
  busy: false
};

/* 데이터가 있어야만 열 수 있는 화면입니다.
   새로고침이나 브라우저 뒤로가기로 곧장 들어오면 랜딩으로 되돌립니다. */

const NEEDS_FILE     = ["intent", "whoami", "result-all", "result-speaker"];
const NEEDS_SENTENCE = ["result-sentence"];

/* ==========================================================
   1. 등급

   임계값 20 / 40 / 60 / 80 은
   forty_scan_features.py 의 GRADES 와 반드시 같아야 합니다.

     (20,  "완전 청정")
     (40,  "정상 범주")
     (60,  "영포티 경계")
     (80,  "영포티 고위험군")
     (101, "말기 영포티")

   등급 이름과 코멘트는 여기서 만들지 않고
   서버 응답(final_grade / final_comment)을 그대로 씁니다.
   캐릭터 이미지를 고르는 데에만 구간을 씁니다.

   /s 공유 미리보기(forty_web.py)도 같은 GRADES 로 등급 이름을
   다시 계산하므로, 등급 이름은 이제 공개 링크에 노출되는
   공개 계약이기도 합니다.
   ========================================================== */

function gradeStep(score) {
  if (score < 20) return 1;   /* 완전 청정 */
  if (score < 40) return 2;   /* 정상 범주 */
  if (score < 60) return 3;   /* 영포티 경계 */
  if (score < 80) return 4;   /* 영포티 고위험군 */
  return 5;                   /* 말기 영포티 */
}

/* charImg 폴더는 static 밖에 있어서 forty_web.py 가 /charimg 로 따로 붙여 둡니다. */

function charSrc(score) {
  return "/charimg/level" + gradeStep(score) + ".png";
}

/* 분석을 기다리는 동안 5장을 미리 받아 둡니다.
   장당 0.7~1.6MB 라서 결과 화면에서 처음 받으면 늦게 뜹니다. */

let preloaded = false;

function preloadChars() {
  if (preloaded) return;
  preloaded = true;
  for (let i = 1; i <= 5; i++) {
    const img = new Image();
    img.src = "/charimg/level" + i + ".png";
  }
}

/* ==========================================================
   2. 화면 전환
   ========================================================== */

const frame   = document.querySelector(".frame");
const screens = {};

document.querySelectorAll(".screen").forEach(function (el) {
  screens[el.dataset.screen] = el;
});

const backBtn = document.getElementById("back");

let current = null;

function show(name) {

  /* 데이터 없이 결과 화면으로 들어오는 경우를 막습니다. */
  if (NEEDS_FILE.indexOf(name) >= 0 && !state.all) name = "landing";
  if (NEEDS_SENTENCE.indexOf(name) >= 0 && !state.sentence) name = "landing";

  /* 분석이 돌고 있지 않은데 로딩 화면에 서 있으면 영원히 안 끝납니다. */
  if (name === "loading" && !state.busy) name = "landing";

  if (!screens[name]) name = "landing";

  /* 모달을 열어 둔 채 뒤로가기를 누르면 모달만 남습니다.
     shareKind 도 화면과 어긋납니다.
     shareOverlay 는 아래 4번 섹션에서 const 로 선언되는데
     show() 는 이미 부팅 시 한 번 불리므로 TDZ 를 피해
     여기서는 DOM 에서 직접 찾습니다. */
  const shareOverlayEl = document.getElementById("share-overlay");
  if (shareOverlayEl) shareOverlayEl.hidden = true;

  Object.keys(screens).forEach(function (key) {
    screens[key].classList.toggle("is-active", key === name);
  });

  current = name;
  backBtn.hidden = (name === "landing" || name === "loading");

  frame.scrollTop = 0;
  window.scrollTo({ top: 0, behavior: "auto" });
}

/* 브라우저 뒤로가기도 화면 뒤로가기로 이어집니다. */

function go(name) {
  if (name === current) return;
  history.pushState({ screen: name }, "");
  show(name);
}

/* 로딩 화면을 나갈 때 씁니다.

   결과 화면을 새 기록으로 쌓으면 결과에서 뒤로가기를 눌렀을 때
   분석이 이미 끝난 로딩 화면으로 되돌아가 영영 멈춰 있게 됩니다.
   그래서 로딩 기록을 결과로 덮어씁니다.

   landing → entry → sentence → loading
                              → (덮어쓰기) result-sentence
   결과에서 뒤로 = sentence 로 돌아갑니다. */

function goReplace(name) {
  history.replaceState({ screen: name }, "");
  show(name);
}

window.addEventListener("popstate", function (e) {
  show((e.state && e.state.screen) || "landing");
});

history.replaceState({ screen: "landing" }, "");
show("landing");

backBtn.addEventListener("click", function () { history.back(); });

/* 좌상단 FS 뱃지 — 어느 화면에서든 누르면 맨 처음(랜딩)으로.
   분석 중(로딩)에 눌러도 안전합니다. 위쪽의 fetch 콜백들이
   current !== "loading" 이면 결과를 화면에 반영하지 않고 조용히 멈춥니다. */

document.getElementById("logo").addEventListener("click", function () { go("landing"); });

/* data-go="화면이름" 이 붙은 버튼은 그 화면으로 넘어갑니다. */

document.addEventListener("click", function (e) {
  const el = e.target.closest("[data-go]");
  if (el) go(el.dataset.go);
});

/* ==========================================================
   3. 준비중 토스트

   아직 만들지 않은 기능(개인정보 안내)은
   눌리기는 하되 안내만 띄웁니다.
   SNS 공유는 13번 섹션, 이미지 저장은 12번 섹션에서
   실제로 동작합니다.
   ========================================================== */

const toastEl = document.getElementById("toast");
let toastTimer = null;

function toast(message) {

/* FastAPI HTTPException 의 detail 은 문자열일 수도, 객체일 수도 있습니다.
   (forty_backend.py 의 화자 오류는 {message, ...} 객체를 돌려줍니다.) */

function readDetail(data, code) {
  if (!data || data.detail === undefined) return "요청에 실패했습니다. (HTTP " + code + ")";
  const d = data.detail;
  if (typeof d === "string") return d;
  if (d && typeof d === "object" && typeof d.message === "string") return d.message;
  return JSON.stringify(d);
}

const errMsg = document.getElementById("err-msg");

function showError(message, backTo) {
  stopLoading();
  errMsg.textContent = message;
  errBackTo = backTo || "entry";
  goReplace("error");
}

/* ---------------- 파일 분석 ---------------- */

/* /analyze-all 한 번이면 전 화자의 점수 / 근거 / 대표 문장이 모두 옵니다.
   그래서 "내 대화" "상대방" "전체 다 보기" 세 갈래를 이 응답 하나로 처리합니다.

   화자 1명짜리 /analyze 를 따로 부르지 않는 이유는
   그쪽이 다른 파서(load_messages)를 써서
   같은 화자인데 점수가 미세하게 달라질 수 있기 때문입니다. */

async function sendFile(file) {
  if (state.busy) return;
  state.busy = true;

  state.file = file;
  state.all = null;
  state.speaker = null;

  startLoading();

  const started = Date.now();

  const fd = new FormData();
  fd.append("file", file);

  try {
    const res = await fetch("/analyze-all", { method: "POST", body: fd });

    let data = null;
    try { data = await res.json(); } catch (_) { data = null; }

    /* 너무 빨리 끝나면 로딩 화면이 깜빡이기만 해서 최소 1.1초는 보여줍니다. */
    const wait = Math.max(0, 1100 - (Date.now() - started));
    await new Promise(function (r) { setTimeout(r, wait); });

    /* 기다리는 동안 사용자가 뒤로 가버렸으면 화면을 낚아채지 않습니다. */
    if (current !== "loading") { stopLoading(); return; }

    if (!res.ok) {
      showError(readDetail(data, res.status), "upload");
      return;
    }

    stopLoading();
    state.all = data;
    renderIntent();
    goReplace("intent");

  } catch (err) {
    if (current !== "loading") { stopLoading(); return; }
    showError("서버에 연결하지 못했습니다. (" + err.message + ")", "upload");
  } finally {
    state.busy = false;
  }
}

/* ---------------- 문장 분석 ---------------- */

async function sendSentence(text) {
  if (state.busy) return;
  state.busy = true;

  startLoading();

  const started = Date.now();

  try {
    const res = await fetch("/analyze-sentence", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    });

    let data = null;
    try { data = await res.json(); } catch (_) { data = null; }

    const wait = Math.max(0, 1100 - (Date.now() - started));
    await new Promise(function (r) { setTimeout(r, wait); });

    if (current !== "loading") { stopLoading(); return; }

    if (!res.ok) {
      showError(readDetail(data, res.status), "sentence");
      return;
    }

    stopLoading();
    state.sentence = data;
    renderSentence(data);
    goReplace("result-sentence");

  } catch (err) {
    if (current !== "loading") { stopLoading(); return; }
    showError("서버에 연결하지 못했습니다. (" + err.message + ")", "sentence");
  } finally {
    state.busy = false;
  }
}

const ARC_LENGTH = Math.PI * 80;   /* 반원 게이지 호의 길이 (r = 80) */

function drawGauge(arcEl, numEl, score, provisional) {

  const color = provisional ? "#b3ab97" : "#158F69";
  arcEl.setAttribute("stroke", color);
  numEl.setAttribute("fill", color);

  /* 먼저 0 으로 두었다가 다음 프레임에 목표값을 넣어야 채워지는 게 보입니다. */
  arcEl.style.transition = "none";
  arcEl.setAttribute("stroke-dasharray", ARC_LENGTH);
  arcEl.setAttribute("stroke-dashoffset", ARC_LENGTH);
  numEl.textContent = "0";

  requestAnimationFrame(function () {
    arcEl.style.transition = "";
    const ratio = Math.max(0, Math.min(100, score)) / 100;
    arcEl.setAttribute("stroke-dashoffset", ARC_LENGTH * (1 - ratio));
  });

  countUp(numEl, score);
}

function countUp(el, target) {
  const started = performance.now();
  const dur = 900;

  function step(now) {
    const t = Math.min(1, (now - started) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(target * eased);
    if (t < 1) requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}

/* 캐릭터는 다 받은 다음에 띄웁니다. 안 그러면 반쯤 그려진 채로 팝인합니다. */

function setChar(stageEl, imgEl, score, provisional) {
  imgEl.classList.remove("in");
  stageEl.classList.toggle("dim", !!provisional);

  const src = charSrc(score);
  imgEl.alt = "영포티 지수 " + Math.round(score) + "점 캐릭터";

  const show = function () { imgEl.classList.add("in"); };

  imgEl.onload = show;
  imgEl.src = src;
  if (imgEl.complete) show();
}

/* ---------------- 문장 결과 ---------------- */

function renderSentence(r) {
  drawGauge(document.getElementById("s-arc"), document.getElementById("s-score"), r.score, false);
  setChar(document.getElementById("s-stage"), document.getElementById("s-char"), r.score, false);

  document.getElementById("s-grade").textContent = r.grade;
  document.getElementById("s-comment").textContent = r.grade_comment;

  const chips = document.getElementById("s-chips");
  chips.innerHTML = "";

  if (!r.detected_features || !r.detected_features.length) {
    chips.innerHTML = '<div class="empty-note">잡힌 특징이 없습니다. 아주 담백한 문장이에요.</div>';
  } else {
    r.detected_features.forEach(function (f) {
      chips.appendChild(featureChip(f));
    });
  }

  celebrate(r.score);
}

function featureChip(f) {
  const chip = document.createElement("span");
  chip.className = "chip" + (f.is_fuzzy ? " fuzzy" : "");
  chip.innerHTML = featureLabel(f.name) +
    ' <span class="n">×' + f.count + "</span>" +
    (f.is_fuzzy ? ' <span class="n">오타 보정</span>' : "");
  return chip;
}

function featureLabel(name) {
  return escapeHtml(name.replace(/_/g, " "));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* ---------------- 화자 1명 결과 ---------------- */

function renderSpeaker(r) {
  drawGauge(document.getElementById("p-arc"), document.getElementById("p-score"), r.final_score, r.is_provisional);
  setChar(document.getElementById("p-stage"), document.getElementById("p-char"), r.final_score, r.is_provisional);

  document.getElementById("p-tag").textContent = r.speaker;

  const gradeEl = document.getElementById("p-grade");
  gradeEl.textContent = r.final_grade;
  gradeEl.classList.toggle("prov", !!r.is_provisional);

  document.getElementById("p-comment").textContent = r.final_comment;

  const meta = document.getElementById("p-meta");
  meta.innerHTML = "";

  if (r.is_provisional) {
    /* 메시지가 너무 적어 판정을 보류한 화자입니다.
       초록이나 빨강을 붙이면 판정이 난 것처럼 읽히기 때문에 회색으로 둡니다. */
    meta.innerHTML = '<span class="prov-badge">표본 부족 · 판정 보류</span> ' +
      "메시지 " + r.message_count + "개";
  } else {
    meta.textContent =
      "메시지 " + r.message_count + "개 · 신뢰도 " + Math.round(r.reliability * 100) + "%";
  }

  renderEvidence(document.getElementById("p-acc"), r);

  if (!r.is_provisional) celebrate(r.final_score);
}

/* 근거 특징 + 대표 문장 */

function renderEvidence(box, r) {
  box.innerHTML = "";

  const feats = r.top_features || [];

  if (feats.length) {
    const t = document.createElement("div");
    t.className = "acc-title";
    /* 계수가 음수인 특징(초성체 / 신조어 등)은 점수를 오히려 내리기 때문에
       "끌어올린 특징" 이라고 뭉뚱그리면 방향이 반대로 읽힙니다. */
    t.textContent = "판단 근거";
    box.appendChild(t);

    const max = Math.max.apply(null, feats.map(function (f) { return Math.abs(f.contribution); }));

    feats.forEach(function (f) {
      const up = f.contribution >= 0;
      const pct = max > 0 ? Math.max(4, Math.abs(f.contribution) / max * 100) : 0;

      const row = document.createElement("div");
      row.className = "feat";
      row.innerHTML =
        '<div class="feat-top">' +
          '<span class="feat-name">' + featureLabel(f.name) + "</span>" +
          '<span class="feat-count">' + f.count + "회" + (f.is_fuzzy ? " · 오타 보정" : "") + "</span>" +
          '<span class="feat-dir ' + (up ? "up" : "down") + '">' + (up ? "▲ 지수 올림" : "▼ 지수 낮춤") + "</span>" +
        "</div>" +
        '<div class="feat-track"><div class="feat-fill ' + (up ? "up" : "down") + '"></div></div>';

      box.appendChild(row);

      const fill = row.querySelector(".feat-fill");
      requestAnimationFrame(function () { fill.style.width = pct + "%"; });
    });
  }

  const quotes = r.top_sentences || [];

  if (quotes.length) {
    const t2 = document.createElement("div");
    t2.className = "acc-title";
    t2.textContent = "지수가 높았던 문장";
    box.appendChild(t2);

    quotes.forEach(function (q) {
      const el = document.createElement("div");
      el.className = "quote";
      el.innerHTML = escapeHtml(q.text) +
        '<span class="q-score">' + Math.round(q.score) + "점 · " + escapeHtml(q.grade) + "</span>";
      box.appendChild(el);
    });
  }

  if (!feats.length && !quotes.length) {
    box.innerHTML = '<div class="empty-note">근거로 삼을 만한 특징이 잡히지 않았습니다.</div>';
  }
}

/* ==========================================================
   11. 확진 영포티 컨페티

   5단계일 때만 한 번 뿌립니다.
   ========================================================== */

const confettiBox = document.getElementById("confetti");

function celebrate(score) {
  if (gradeStep(score) < 5) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  confettiBox.innerHTML = "";

  const colors = ["#FEC926", "#158F69", "#FEE500", "#7fae9c"];

  for (let i = 0; i < 34; i++) {
    const bit = document.createElement("i");
    bit.style.left = Math.random() * 100 + "%";
    bit.style.background = colors[i % colors.length];
    bit.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
    bit.style.animationDelay = (Math.random() * 0.5) + "s";
    bit.style.opacity = 0.55 + Math.random() * 0.45;
    confettiBox.appendChild(bit);
  }

  setTimeout(function () { confettiBox.innerHTML = ""; }, 3600);
}

/* ==========================================================
   12. 결과 이미지 저장

   화면을 그대로 캡처하지 않고 1080x1350 세로 카드를
   <canvas> 에 코드로 직접 그려서 PNG 로 저장합니다.

   화면 캡처(html2canvas 등) 대신 이 방식을 고른 이유:
   - 결과 화면엔 인라인 SVG 게이지, 구글 웹폰트, CSS 그라디언트,
     진행 중인 트랜지션/애니메이션이 섞여 있어 캡처 결과가 들쭉날쭉합니다.
   - 버튼/아코디언까지 같이 찍히는 것도 공유용으로는 맞지 않습니다.
   - 외부 라이브러리를 하나도 늘리지 않아도 됩니다.
   ========================================================== */

const CARD_W = 1080;
const CARD_H = 1350;

/* CSS :root 변수(29~45행)와 값을 맞춘 리터럴입니다.
   canvas 는 CSS 변수를 못 읽어서 여기 따로 둡니다. */

const CARD_COLOR = {
  cream: "#FAFAF0",
  line: "#ecdfc0",
  green: "#158F69",
  yellow: "#FEC926",
  ink: "#3d3627",
  muted: "#a89a7a",
  track: "#dcece4",
  gray: "#b3ab97"
};

let savingBusy = false;

/* ---------------- 공통 유틸 ---------------- */

function loadImage(src) {
  return new Promise(function (resolve, reject) {
    const img = new Image();
    img.onload = function () { resolve(img); };
    img.onerror = reject;
    img.src = src;
  });
}

/* 구글 폰트가 아직 안 왔으면 최대 1.5초만 기다립니다.
   CDN 이 막혀 있거나 오프라인이면 폴백 폰트로 조용히 그립니다. */

function ensureFont() {
  if (!(window.FontFace && document.fonts && document.fonts.load)) {
    return Promise.resolve();
  }
  const wait = document.fonts.load('400 96px "Black Han Sans"').catch(function () {});
  const timeout = new Promise(function (r) { setTimeout(r, 1500); });
  return Promise.race([wait, timeout]);
}

const CARD_FONT_HEAD = '"Black Han Sans", "Malgun Gothic", sans-serif';
const CARD_FONT_BODY = '"Pretendard", "Malgun Gothic", sans-serif';

/* 한국어는 띄어쓰기 단위로만 자르면 한 단어가 카드 폭을 넘기는 경우가 있어서
   공백 우선으로 자르고, 그래도 넘치면 글자 단위로도 자릅니다. */

function wrapText(ctx, text, maxWidth) {
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let line = "";

  function pushChar(ch) {
    if (ctx.measureText(line + ch).width <= maxWidth || !line) {
      line += ch;
    } else {
      lines.push(line);
      line = ch;
    }
  }

  words.forEach(function (word, i) {
    const candidate = line ? line + " " + word : word;
    if (ctx.measureText(candidate).width <= maxWidth) {
      line = candidate;
    } else {
      if (line) lines.push(line);
      line = "";
      if (ctx.measureText(word).width <= maxWidth) {
        line = word;
      } else {
        for (const ch of word) pushChar(ch);
      }
    }
  });

  if (line) lines.push(line);
  return lines;
}

function roundRect(ctx, x, y, w, h, r) {
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    return;
  }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* 결과 화면의 반원 게이지(856~860행)를 canvas 로 다시 그립니다. */

function drawArcGauge(ctx, cx, cy, r, score, color) {
  const start = Math.PI;
  const end = 0;
  const ratio = Math.max(0, Math.min(100, score)) / 100;
  const mid = start + (end - start) * ratio;

  ctx.lineCap = "round";
  ctx.lineWidth = r * 0.2;

  ctx.strokeStyle = CARD_COLOR.track;
  ctx.beginPath();
  ctx.arc(cx, cy, r, start, end, true);
  ctx.stroke();

  if (ratio > 0) {
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, r, start, mid, true);
    ctx.stroke();
  }
}

/* 세 카드가 공유하는 틀: 배경 / 테두리 / 상단 로고 / 하단 푸터.
   틀을 먼저 그리고 각 렌더러가 그 위에 내용을 채웁니다. */

async function drawCardShell(ctx) {
  ctx.fillStyle = CARD_COLOR.cream;
  ctx.fillRect(0, 0, CARD_W, CARD_H);

  roundRect(ctx, 12, 12, CARD_W - 24, CARD_H - 24, 40);
  ctx.strokeStyle = CARD_COLOR.line;
  ctx.lineWidth = 3;
  ctx.stroke();

  try {
    const icon = await loadImage("img/icon.png");
    ctx.save();
    roundRect(ctx, 64, 64, 64, 64, 16);
    ctx.clip();
    ctx.drawImage(icon, 64, 64, 64, 64);
    ctx.restore();
  } catch (e) { /* 로고가 없어도 카드는 계속 그립니다 */ }

  ctx.fillStyle = CARD_COLOR.ink;
  ctx.font = "600 32px " + CARD_FONT_BODY;
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.fillText("영포티 판독기", 148, 96);

  ctx.fillStyle = CARD_COLOR.muted;
  ctx.font = "400 26px " + CARD_FONT_BODY;
  ctx.textAlign = "center";
  ctx.fillText("FORTY-SCAN · forty-scan.app", CARD_W / 2, CARD_H - 70);
}

/* 스테이지(글로우 + 캐릭터)를 그립니다. cy 는 캐릭터 중심 y, size 는 캐릭터 한 변 길이. */

async function drawStage(ctx, cx, cy, size, score) {
  const glow = ctx.createRadialGradient(cx, cy, size * 0.1, cx, cy, size * 0.7);
  glow.addColorStop(0, "rgba(21,143,105,0.16)");
  glow.addColorStop(1, "rgba(21,143,105,0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.7, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "rgba(61,54,39,0.08)";
  ctx.beginPath();
  ctx.ellipse(cx, cy + size * 0.42, size * 0.32, size * 0.07, 0, 0, Math.PI * 2);
  ctx.fill();

  try {
    const char = await loadImage(charSrc(score));
    /* CSS 의 .stage .char 와 같은 규칙: object-fit:contain, object-position:bottom.
       높이를 size 에 맞추고 원본 비율대로 폭을 정해서 늘어나지 않게 합니다. */
    const drawH = size;
    const drawW = drawH * (char.naturalWidth / char.naturalHeight);
    const bottom = cy + size / 2;
    ctx.drawImage(char, cx - drawW / 2, bottom - drawH, drawW, drawH);
  } catch (e) { /* 캐릭터 이미지가 안 오더라도 나머지는 그립니다 */ }
}

function drawGaugeBlock(ctx, cy, score, color) {
  const cx = CARD_W / 2;
  const r = 240;

  drawArcGauge(ctx, cx, cy, r, score, color);

  ctx.fillStyle = color;
  ctx.font = "400 120px " + CARD_FONT_HEAD;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(String(Math.round(score)), cx, cy - 20);
}

function drawFeatureChips(ctx, y, features) {
  if (!features || !features.length) return y;

  const top = features.slice(0, 3);
  ctx.font = "500 26px " + CARD_FONT_BODY;

  const gap = 16;
  const padX = 22;
  const widths = top.map(function (f) {
    return ctx.measureText(f.name.replace(/_/g, " ") + " ×" + f.count).width + padX * 2;
  });
  const total = widths.reduce(function (a, b) { return a + b; }, 0) + gap * (top.length - 1);

  let x = CARD_W / 2 - total / 2;

  top.forEach(function (f, i) {
    const w = widths[i];
    const label = f.name.replace(/_/g, " ") + " ×" + f.count;

    ctx.fillStyle = "rgba(21,143,105,0.09)";
    roundRect(ctx, x, y, w, 56, 28);
    ctx.fill();

    ctx.fillStyle = CARD_COLOR.green;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x + w / 2, y + 29);

    x += w + gap;
  });

  return y + 56;
}

/* ---------------- 카드 렌더러 3종 ---------------- */

async function makeSentenceCard(r) {
  const canvas = document.createElement("canvas");
  canvas.width = CARD_W;
  canvas.height = CARD_H;
  const ctx = canvas.getContext("2d");

  await drawCardShell(ctx);
  await drawStage(ctx, CARD_W / 2, 380, 380, r.score);

  drawGaugeBlock(ctx, 760, r.score, CARD_COLOR.green);

  ctx.fillStyle = CARD_COLOR.ink;
  ctx.font = "400 52px " + CARD_FONT_HEAD;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(r.grade, CARD_W / 2, 850);

  ctx.fillStyle = CARD_COLOR.muted;
  ctx.font = "400 30px " + CARD_FONT_BODY;
  const commentLines = wrapText(ctx, r.grade_comment || "", CARD_W - 200);
  commentLines.slice(0, 2).forEach(function (line, i) {
    ctx.fillText(line, CARD_W / 2, 900 + i * 42);
  });

  drawFeatureChips(ctx, 1010, r.detected_features);

  return canvas;
}

async function makeSpeakerCard(r) {
  const canvas = document.createElement("canvas");
  canvas.width = CARD_W;
  canvas.height = CARD_H;
  const ctx = canvas.getContext("2d");

  const color = r.is_provisional ? CARD_COLOR.gray : CARD_COLOR.green;

  await drawCardShell(ctx);
  await drawStage(ctx, CARD_W / 2, 360, 360, r.final_score);

  ctx.fillStyle = CARD_COLOR.ink;
  ctx.font = "500 34px " + CARD_FONT_BODY;
  ctx.textAlign = "center";
  ctx.fillText(r.speaker, CARD_W / 2, 570);

  drawGaugeBlock(ctx, 740, r.final_score, color);

  ctx.fillStyle = CARD_COLOR.ink;
  ctx.font = "400 52px " + CARD_FONT_HEAD;
  ctx.fillText(r.final_grade, CARD_W / 2, 830);

  ctx.fillStyle = CARD_COLOR.muted;
  ctx.font = "400 30px " + CARD_FONT_BODY;
  const commentLines = wrapText(ctx, r.final_comment || "", CARD_W - 200);
  commentLines.slice(0, 2).forEach(function (line, i) {
    ctx.fillText(line, CARD_W / 2, 880 + i * 42);
  });

  const metaY = 960 + Math.max(0, commentLines.length - 1) * 42;
  ctx.font = "400 26px " + CARD_FONT_BODY;
  ctx.fillStyle = color;

  if (r.is_provisional) {
    ctx.fillText("표본 부족 · 판정 보류 · 메시지 " + r.message_count + "개", CARD_W / 2, metaY);
  } else {
    ctx.fillText("메시지 " + r.message_count + "개 · 신뢰도 " + Math.round(r.reliability * 100) + "%", CARD_W / 2, metaY);
  }

  return canvas;
}

async function makeRankCard(all) {
  const canvas = document.createElement("canvas");
  canvas.width = CARD_W;
  canvas.height = CARD_H;
  const ctx = canvas.getContext("2d");

  const results = all.results;
  const top = results[0];
  const MEDALS = ["🥇", "🥈", "🥉"];

  await drawCardShell(ctx);
  await drawStage(ctx, CARD_W / 2, 430, 640, top.final_score);

  ctx.fillStyle = CARD_COLOR.ink;
  ctx.font = "500 34px " + CARD_FONT_BODY;
  ctx.textAlign = "center";
  ctx.fillText("1위 · " + top.speaker, CARD_W / 2, 800);

  ctx.font = "400 26px " + CARD_FONT_BODY;
  ctx.fillStyle = CARD_COLOR.muted;
  ctx.fillText("우리 방 순위", CARD_W / 2, 840);

  const listTop = 910;
  const rowH = 105;
  const shown = results.slice(0, 3);
  const listX = 90;
  const listW = CARD_W - listX * 2;

  shown.forEach(function (r, i) {
    const y = listTop + i * rowH;
    const provisional = !!r.is_provisional;

    ctx.font = "34px " + CARD_FONT_BODY;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(MEDALS[i], listX, y + rowH / 2);

    ctx.fillStyle = CARD_COLOR.ink;
    ctx.font = "500 32px " + CARD_FONT_BODY;
    ctx.fillText(r.speaker, listX + 68, y + rowH / 2);

    const barX = listX + 320;
    const barW = listW - 320 - 90;
    const barH = 18;
    const barY = y + rowH / 2 - barH / 2;

    ctx.fillStyle = CARD_COLOR.track;
    roundRect(ctx, barX, barY, barW, barH, barH / 2);
    ctx.fill();

    const pct = Math.max(2, Math.min(100, r.final_score)) / 100;
    if (provisional) {
      ctx.fillStyle = CARD_COLOR.gray;
    } else {
      const grad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
      grad.addColorStop(0, CARD_COLOR.yellow);
      grad.addColorStop(1, CARD_COLOR.green);
      ctx.fillStyle = grad;
    }
    roundRect(ctx, barX, barY, barW * pct, barH, barH / 2);
    ctx.fill();

    ctx.fillStyle = provisional ? CARD_COLOR.gray : CARD_COLOR.ink;
    ctx.font = "500 30px " + CARD_FONT_BODY;
    ctx.textAlign = "right";
    ctx.fillText(String(Math.round(r.final_score)), listX + listW, y + rowH / 2);
  });

  if (results.length > shown.length) {
    ctx.fillStyle = CARD_COLOR.muted;
    ctx.font = "400 26px " + CARD_FONT_BODY;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("외 " + (results.length - shown.length) + "명", CARD_W / 2, listTop + shown.length * rowH + 35);
  }

  return canvas;
}

/* ---------------- 저장 파이프라인 ---------------- */

/* 1순위: OS 공유 시트. 사진 앱 저장이나 카톡 전송으로 바로 이어질 수 있고,
   iOS Safari 처럼 <a download> 가 제대로 안 먹히는 환경에서도 확실히 동작합니다.
   지원하지 않거나 실패하면 다운로드로 폴백합니다. */

async function saveCard(makeFn, arg, slug) {
  if (savingBusy) return;
  savingBusy = true;
  toast("이미지를 만들고 있어요…");

  try {
    await ensureFont();
    const canvas = await makeFn(arg);
    const blob = await new Promise(function (resolve) {
      canvas.toBlob(resolve, "image/png");
    });
    if (!blob) throw new Error("blob 생성 실패");

    const filename = "forty-scan-" + slug + ".png";
    const file = new File([blob], filename, { type: "image/png" });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: "영포티 판독기" });
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return; /* 사용자가 공유를 취소했습니다 */
        /* 공유가 실패하면 아래 다운로드로 넘어갑니다 */
      }
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);

    toast("이미지를 저장했어요 📸");

  } catch (err) {
    toast("이미지를 만들지 못했습니다 😢");
  } finally {
    savingBusy = false;
  }
}

document.getElementById("s-save").addEventListener("click", function () {
  if (!state.sentence) { toast("판독 결과가 없습니다."); return; }
  saveCard(makeSentenceCard, state.sentence, "sentence-" + Math.round(state.sentence.score));
});

document.getElementById("p-save").addEventListener("click", function () {
  if (!state.speaker) { toast("판독 결과가 없습니다."); return; }
  saveCard(makeSpeakerCard, state.speaker, "speaker-" + Math.round(state.speaker.final_score));
});

document.getElementById("a-save").addEventListener("click", function () {
  if (!state.all) { toast("판독 결과가 없습니다."); return; }
  saveCard(makeRankCard, state.all, "rank");
});

/* ==========================================================
   13. SNS 공유

   공유 링크는 서버의 /s 로 갑니다.
   /s 는 og 태그가 박힌 미리보기 페이지를 돌려주고,
   화면 아래 "나도 해보기" 버튼이 /ui/ 로 데려옵니다.

   링크에 담는 것은 점수와 결과 종류뿐입니다.
   화자 이름과 입력 문장은 담지 않습니다.
   등급 이름도 담지 않습니다. /s 가 점수에서 다시 계산합니다.
   ========================================================== */

/* ---------------- 공유 대상 ---------------- */

function shareTarget(kind) {

  if (kind === "s") {
    if (!state.sentence) return null;
    return { t: "s", score: state.sentence.score, prov: false };
  }

  if (kind === "a") {
    if (!state.all || !state.all.results.length) return null;
    const top = state.all.results[0];
    return { t: "a", score: top.final_score, prov: !!top.is_provisional };
  }

  if (!state.speaker) return null;
  return {
    t: "p",
    score: state.speaker.final_score,
    prov: !!state.speaker.is_provisional
  };
}

/* location.origin 이 이미 절대 주소(https 포함)입니다.
   서버 주소를 따로 내려받을 필요가 없습니다. */

function shareUrl(target) {
  let url = location.origin + "/s?t=" + target.t +
            "&sc=" + Math.round(target.score);

  /* 표본 부족 결과는 등급 이름을 붙이면 안 됩니다.
     (앱 화면도 "표본 부족" 이라고만 씁니다) */
  if (target.prov) url += "&p=1";

  return url;
}

function shareTitle(target) {
  return "내 영포티 지수는 " + Math.round(target.score) + "점!";
}

const SHARE_DESC = "카카오톡 말투로 알아보는 나의 영포티 지수";

/* ---------------- 링크 복사 ---------------- */

/* navigator.clipboard 는 보안 컨텍스트(https / localhost)에서만 있습니다.
   http://192.168.x.x:8000 으로 폰에서 테스트할 때가 바로 그 경우라
   execCommand 폴백이 실제로 쓰입니다. */

function legacyCopy(text) {
  const area = document.createElement("textarea");
  area.value = text;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.top = "0";
  area.style.opacity = "0";
  document.body.appendChild(area);

  area.select();
  area.setSelectionRange(0, text.length);   /* iOS 사파리는 이게 있어야 합니다 */

  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }

  area.remove();
  return ok;
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(
      function () { return true; },
      function () { return legacyCopy(text); }
    );
  }
  return Promise.resolve(legacyCopy(text));
}

/* ---------------- 카카오톡 ---------------- */

/* 카카오 개발자 문서(자바스크립트 시작하기)에서 SDK 버전을 확인하세요.
   integrity 를 붙이려면 문서의 src + integrity 를 반드시 쌍으로
   그대로 복사하세요. 해시를 손으로 써서 버전과 어긋나면
   브라우저가 스크립트를 아무 말 없이 버리고, 그러면
   카카오 버튼이 이유 없이 항상 링크 복사로만 동작하게 됩니다. */

const KAKAO_SDK_SRC = "https://t1.kakaocdn.net/kakao_js_sdk/2.7.5/kakao.min.js";

let kakaoReady = null;

/* 첫 클릭 때만 받습니다. 모든 방문자에게 CDN 스크립트를 물리지 않습니다. */

function loadKakao() {
  if (!window.__KAKAO_KEY__) {
    return Promise.reject(new Error("카카오 키가 설정되지 않았습니다"));
  }
  if (kakaoReady) return kakaoReady;

  kakaoReady = new Promise(function (resolve, reject) {
    const s = document.createElement("script");
    s.src = KAKAO_SDK_SRC;
    s.crossOrigin = "anonymous";
    s.onload = resolve;
    s.onerror = function () { reject(new Error("SDK 로드 실패")); };
    document.head.appendChild(s);
  }).then(function () {
    if (!window.Kakao) throw new Error("SDK 없음");
    if (!Kakao.isInitialized()) Kakao.init(window.__KAKAO_KEY__);
  });

  return kakaoReady;
}

async function shareKakao(target) {
  const url = shareUrl(target);

  try {
    await loadKakao();

    Kakao.Share.sendDefault({
      objectType: "feed",
      content: {
        title: shareTitle(target),
        description: SHARE_DESC,
        imageUrl: location.origin + "/ui/img/keyart.png",
        link: { mobileWebUrl: url, webUrl: url }
      },
      buttons: [
        { title: "나도 해보기", link: { mobileWebUrl: url, webUrl: url } }
      ]
    });

    closeShare();

  } catch (err) {
    /* 키가 아직 없거나(카카오 콘솔 설정 전) 도메인이 등록되지 않았거나
       CDN 이 막힌 환경입니다. 기능을 죽이지 않고 링크 복사로 대신합니다. */
    kakaoReady = null;
    const ok = await copyText(url);
    closeShare();
    toast(ok ? "링크를 복사했어요. 카톡에 붙여넣어 주세요 🔗"
             : "카카오톡 공유를 쓸 수 없어요 😢");
  }
}

/* ---------------- 페이스북 ---------------- */

/* window.open 은 클릭 핸들러 안에서 "동기로" 불려야 합니다.
   await 를 하나라도 끼우면 팝업 차단기가 막습니다. */

function shareFacebook(target) {
  window.open(
    "https://www.facebook.com/sharer/sharer.php?u=" +
      encodeURIComponent(shareUrl(target)),
    "_blank",
    "noopener,noreferrer,width=600,height=640"
  );
  closeShare();
}

/* ---------------- 인스타그램 ---------------- */

/* 인스타그램에는 웹에서 부를 수 있는 공유 인텐트가 없습니다.
   (오직 앱 안에서만 게시할 수 있습니다)
   그래서 12번 섹션의 이미지 저장 경로로 넘깁니다.
   저장된 카드를 사용자가 스토리에 올리면 됩니다.

   버튼을 직접 눌러서 기존 핸들러의 "결과 없음" 방어까지 그대로 씁니다. */

function shareImage(kind) {
  closeShare();
  const id = kind === "s" ? "s-save" : (kind === "a" ? "a-save" : "p-save");
  document.getElementById(id).click();
}

/* ---------------- 버튼 연결 ---------------- */

const SHARE_ACTION = {
  kakao: shareKakao,
  fb: shareFacebook,
  link: function (target) {
    const url = shareUrl(target);
    copyText(url).then(function (ok) {
      closeShare();
      toast(ok ? "링크를 복사했어요 🔗" : "링크를 복사하지 못했어요 😢");
    });
  }
};

document.addEventListener("click", function (e) {
  const el = e.target.closest("[data-share]");
  if (!el) return;

  /* 문장 결과 화면의 아이콘은 kind 를 직접 갖고 있고,
     모달 안의 아이콘은 openShare 가 정해 둔 shareKind 를 씁니다. */
  const kind = el.dataset.shareKind || shareKind;

  if (el.dataset.share === "insta") { shareImage(kind); return; }

  const target = shareTarget(kind);
  if (!target) { toast("판독 결과가 없습니다."); return; }

  SHARE_ACTION[el.dataset.share](target);
});
</script>

</body>
</html>
