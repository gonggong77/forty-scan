<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영포티 판독기 · FORTY-SCAN</title>

<!-- 브라우저 탭 아이콘. 파일을 따로 두지 않으려고 SVG 를 그대로 넣었습니다.
     (없으면 /favicon.ico 요청이 404 로 찍힙니다.) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23158F69'/%3E%3Ctext x='16' y='22' font-family='Arial,sans-serif' font-size='14' font-weight='bold' fill='%23fff' text-anchor='middle'%3EFS%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">

<style>
/* ==========================================================
   영포티 판독기 화면

   디자인은 아래 두 시안을 그대로 옮긴 것입니다.

     static/forty_scan_web_wireframe.html    (웹  640px 프레임)
     static/forty_scan_wireframe_board.html  (모바일 300x560 프레임)

   한 파일로 두 시안을 모두 커버합니다.
   600px 아래에서 모바일 시안 레이아웃으로 바뀝니다.
   ========================================================== */

:root {
  --cream: #FAFAF0;
  --page: #F5EFE0;
  --green: #158F69;
  --green-dk: #158F69;
  --green-tint: rgba(21,143,105,0.09);
  --yellow: #FEC926;
  --yellow-tint: rgba(254,201,38,0.20);
  --ink: #3d3627;
  --muted: #a89a7a;
  --white: #ffffff;
  --line: #ecdfc0;
  --track: #dcece4;
  --gray: #b3ab97;

  --dur: .22s;
}

* { box-sizing: border-box; }

html { height: 100%; }

/* body 에 height:100% 를 주면 안 됩니다.
   내용이 화면보다 길어졌을 때 align-items:center 가
   프레임 위쪽을 화면 밖으로 밀어내서 잘립니다. */

body {
  min-height: 100%;
  margin: 0;
  padding: 40px 20px;
  background: var(--page);
  color: var(--ink);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }

/* ---------------- 프레임 ---------------- */

.frame {
  position: relative;
  width: 100%;
  max-width: 640px;
  min-height: 600px;
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 56px 40px 32px;
  display: flex;
  flex-direction: column;
}
/* .frame 에 overflow:hidden 을 걸면
   내용이 화면보다 길어졌을 때(근거 아코디언을 펼친 결과 화면 등)
   가운데 정렬 때문에 위쪽이 잘려서 못 보게 됩니다.
   컨페티는 .confetti 가 스스로 잘라내므로 여기서는 필요 없습니다. */

.logo-badge {
  position: absolute; top: 14px; left: 18px; z-index: 3;
  width: 26px; height: 26px; border-radius: 8px;
  background: var(--green); color: #fff;
  font-size: 9px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  border: none; cursor: pointer;
  transition: transform .12s ease, filter .12s ease;
}
.logo-badge:hover { filter: brightness(1.08); }
.logo-badge:active { transform: scale(.92); }

.back-web {
  position: absolute; top: 14px; right: 20px; z-index: 3;
  background: var(--white);
  border: 1.5px solid var(--green);
  color: var(--green);
  font-size: 12px; font-weight: 800;
  padding: 6px 13px;
  border-radius: 999px;
  transition: transform .12s ease, background .12s ease;
}
.back-web:hover { background: var(--green-tint); }
.back-web:active { transform: scale(.95); }
.back-web[hidden] { display: none; }

/* ---------------- 화면 전환 ---------------- */

.screen { display: none; }

.screen.is-active {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  animation: screenIn var(--dur) ease both;
}

@keyframes screenIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

/* ---------------- 공통 타이포 ---------------- */

.headline { font-size: 22px; font-weight: 800; color: var(--green-dk); text-align: center; line-height: 1.4; }
.sub-min { font-size: 13px; color: var(--muted); text-align: center; }
.tiny-link { font-size: 13px; color: var(--muted); text-decoration: none; }
.tiny-link:hover { color: var(--green); }

.stk, .headline, .pill-btn, .round-btn, .opt-tile .lb, .gauge-grade, .mini-name, .score-num {
  font-family: "Black Han Sans", "Pretendard", "Malgun Gothic", sans-serif;
  font-weight: 400;
}

/* ---------------- 버튼 ---------------- */

.pill-btn {
  width: 220px; height: 48px;
  background: var(--green); color: #fff;
  border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  transition: transform .12s ease, box-shadow .2s ease, background .15s ease;
  box-shadow: 0 4px 0 rgba(21,143,105,.22);
}
.pill-btn:hover { box-shadow: 0 6px 14px rgba(21,143,105,.26); }
.pill-btn:active { transform: translateY(2px) scale(.98); box-shadow: 0 1px 0 rgba(21,143,105,.22); }

.pill-btn.ghost {
  background: var(--white); color: var(--green);
  border: 1.5px solid var(--green);
  box-shadow: none;
}
.pill-btn.ghost:hover { background: var(--green-tint); }

.round-btn {
  width: 140px; height: 140px;
  background: var(--green); color: #fff;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  box-shadow: 0 6px 0 rgba(21,143,105,.22);
  transition: transform .12s ease, box-shadow .2s ease;
}
.round-btn:hover { box-shadow: 0 10px 20px rgba(21,143,105,.28); }
.round-btn:active { transform: translateY(3px) scale(.98); box-shadow: 0 2px 0 rgba(21,143,105,.22); }

.btn-row { display: flex; gap: 10px; width: 100%; max-width: 380px; }
.btn-row .pill-btn { flex: 1; width: auto; }

/* ---------------- 정사각 중심 영역 ---------------- */

.square {
  width: 380px; max-width: 100%;
  height: 380px;
  background: var(--green-tint);
  border-radius: 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  overflow: hidden;
}
.square .mark { font-size: 40px; }
.square .cap { font-size: 13px; color: #7fae9c; }

/* 랜딩 키아트 */

/* keyart.png 은 시안의 랜딩 이미지에서 투명 여백을 잘라낸 것입니다.
   원본 해상도가 359px 라서 그보다 크게 늘리면 흐려집니다. */
.keyart {
  width: 100%; max-width: 360px;
  display: block;
  animation: popIn .5s cubic-bezier(.2,.9,.3,1.2) both;
}
@keyframes popIn {
  from { opacity: 0; transform: scale(.88) translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.landing-spacer { flex: 1; min-height: 8px; }

/* ---------------- 선택 타일 ---------------- */

.opt-wrap {
  width: 380px; max-width: 100%;
  display: flex; flex-direction: column; gap: 12px;
  flex: 1;
}

.opt-tile {
  width: 100%; flex: 1; min-height: 120px;
  background: var(--green-tint);
  border-radius: 20px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px;
  transition: transform .14s ease, background .14s ease, box-shadow .2s ease;
}
.opt-tile:hover { background: rgba(21,143,105,.15); transform: translateY(-2px); box-shadow: 0 8px 18px rgba(21,143,105,.13); }
.opt-tile:active { transform: translateY(0) scale(.99); }
.opt-tile .mark { font-size: 30px; }
.opt-tile .lb { font-size: 16px; color: var(--green-dk); }
.opt-tile .cap { font-size: 12px; color: #7fae9c; }

.intent-grid {
  width: 560px; max-width: 100%;
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-auto-rows: 1fr;
  gap: 16px;
}
.intent-grid .full { grid-column: 1 / 3; }
.intent-grid .opt-tile { border-radius: 28px; }

/* ---------------- 드롭존 ---------------- */

.drop {
  width: 380px; max-width: 100%;
  height: 380px;
  background: var(--green-tint);
  border: 2px dashed transparent;
  border-radius: 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  transition: background .15s ease, border-color .15s ease, transform .15s ease;
}
.drop .mark { font-size: 40px; color: var(--green); transition: transform .2s ease; }
.drop .cap { font-size: 13px; color: #7fae9c; }
.drop:hover { border-color: rgba(21,143,105,.35); }
.drop.hot {
  background: var(--yellow-tint);
  border-color: var(--green);
  transform: scale(1.02);
}
.drop.hot .mark { transform: scale(1.25) rotate(90deg); }

.file-name { font-size: 12px; color: var(--green); font-weight: 700; }

/* ---------------- 문장 입력 ---------------- */

.casual-input {
  width: 320px; max-width: 100%;
  height: 200px;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 22px;
  padding: 18px;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  resize: none;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.casual-input::placeholder { color: var(--muted); }
.casual-input:focus { border-color: var(--green); box-shadow: 0 0 0 4px var(--green-tint); }

/* ---------------- 아바타 ---------------- */

.avatar {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--yellow-tint);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 800; color: var(--green-dk);
  flex-shrink: 0;
  overflow: hidden;
}
.avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 4%;
  display: block;
}
.avatar.lg { width: 84px; height: 84px; font-size: 34px; }
.avatar.dim img { filter: grayscale(1); opacity: .55; }

.who-grid {
  display: flex; flex-wrap: wrap; gap: 28px;
  align-items: flex-start; justify-content: center;
  padding: 20px;
  max-height: 100%;
  overflow-y: auto;
}
.who-item {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  width: 96px;
  transition: transform .14s ease;
}
.who-item:hover { transform: translateY(-3px); }
.who-item:hover .avatar { background: var(--yellow); }
.who-item .nm { font-size: 12px; color: var(--muted); text-align: center; word-break: break-all; line-height: 1.3; }

/* ---------------- 로딩 ---------------- */

.loading-char {
  width: 190px; height: 260px;
  object-fit: contain;
  object-position: bottom;
  animation: bobble 1.6s ease-in-out infinite;
}
@keyframes bobble {
  0%, 100% { transform: translateY(0) rotate(-1.5deg); }
  50%      { transform: translateY(-12px) rotate(1.5deg); }
}

.loading-copy {
  font-size: 18px;
  min-height: 26px;
  transition: opacity .25s ease, transform .25s ease;
}
.loading-copy.fade { opacity: 0; transform: translateY(6px); }

.dots { display: flex; gap: 6px; }
.dots i {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--yellow);
  animation: dot 1s ease-in-out infinite;
}
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot {
  0%, 100% { transform: translateY(0); opacity: .45; }
  50%      { transform: translateY(-6px); opacity: 1; }
}

/* ---------------- 결과: 캐릭터 무대 ---------------- */

.stage {
  position: relative;
  width: 380px; max-width: 100%;
  height: 300px;
  background: var(--green-tint);
  border-radius: 28px;
  overflow: hidden;
  flex-shrink: 0;
}

.stage-glow {
  position: absolute; left: 50%; top: 50%;
  width: 300px; height: 300px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, var(--yellow-tint) 0%, rgba(254,201,38,0) 68%);
  animation: pulseGlow 3.4s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: .85; }
  50%      { transform: translate(-50%,-50%) scale(1.12); opacity: 1; }
}

.stage-floor {
  position: absolute; left: 50%; bottom: 22px;
  width: 190px; height: 16px;
  transform: translateX(-50%);
  background: rgba(21,143,105,.13);
  border-radius: 50%;
  filter: blur(3px);
}

.stage .char {
  position: absolute; left: 50%; bottom: 14px;
  /* 무대 높이에 맞춥니다. 고정값으로 두면
     순위 화면처럼 낮은 무대에서 머리가 잘립니다. */
  height: calc(100% - 26px);
  transform: translateX(-50%);
  object-fit: contain;
  object-position: bottom;
  opacity: 0;
  transition: opacity .35s ease;
}
.stage .char.in {
  opacity: 1;
  animation: charIn .55s cubic-bezier(.2,.9,.3,1.3) both, float 3.6s ease-in-out 0.6s infinite;
}
@keyframes charIn {
  from { opacity: 0; transform: translateX(-50%) translateY(26px) scale(.86); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}
@keyframes float {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50%      { transform: translateX(-50%) translateY(-9px); }
}
.stage.dim .char { filter: grayscale(1); opacity: .6; }
.stage.dim .stage-glow { display: none; }

.stage-tag {
  position: absolute; top: 14px; left: 14px;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 11px; font-weight: 800; color: var(--muted);
}

/* ---------------- 결과: 게이지 ---------------- */

.gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }

.gauge { width: 240px; max-width: 100%; display: block; margin-bottom: -14px; }
.gauge .arc-fill {
  transition: stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1);
}
.score-num { font-size: 34px; }

.gauge-grade { font-size: 22px; color: var(--green-dk); }
.gauge-grade.prov { color: var(--gray); }
.gauge-sub { font-size: 13px; color: var(--muted); text-align: center; }
.gauge-meta { font-size: 11px; color: var(--muted); }

.prov-badge {
  display: inline-block;
  background: var(--yellow-tint);
  color: #8a7a4a;
  border-radius: 999px;
  padding: 4px 11px;
  font-size: 11px; font-weight: 800;
}

/* ---------------- 순위 ---------------- */

.rank-list {
  width: 380px; max-width: 100%;
  display: flex; flex-direction: column; gap: 12px;
  flex: 1; justify-content: center;
  padding: 4px 0;
}

.mini-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%;
  padding: 4px;
  border-radius: 14px;
  text-align: left;
  transition: background .14s ease, transform .14s ease;
  animation: rowIn .4s ease both;
}
.mini-row:hover { background: var(--green-tint); transform: translateX(2px); }
@keyframes rowIn {
  from { opacity: 0; transform: translateX(-10px); }
  to   { opacity: 1; transform: none; }
}
.mini-name {
  font-size: 15px; color: var(--green-dk);
  width: 76px; flex-shrink: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mini-bar-track { flex: 1; height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; }
.mini-bar-fill {
  display: block;   /* span 이라서 이게 없으면 width / height 가 먹지 않습니다. */
  height: 100%; width: 0;
  background: linear-gradient(90deg, var(--yellow), var(--green));
  border-radius: 999px;
  transition: width .8s cubic-bezier(.2,.8,.2,1);
}
.mini-bar-fill.prov { background: var(--gray); }
.mini-score { font-size: 14px; color: var(--muted); width: 30px; text-align: right; flex-shrink: 0; }
.mini-rank { font-size: 12px; color: var(--muted); width: 16px; flex-shrink: 0; text-align: center; }

/* ---------------- 아코디언 ---------------- */

.accordion {
  width: 380px; max-width: 100%;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--white);
  overflow: hidden;
}
.accordion > summary {
  list-style: none;
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; color: var(--muted);
  cursor: pointer;
}
.accordion > summary::-webkit-details-marker { display: none; }
.accordion > summary::after {
  content: "⌄";
  color: var(--yellow);
  font-size: 15px;
  transition: transform .2s ease;
}
.accordion[open] > summary::after { transform: rotate(180deg); }
.accordion .acc-body {
  padding: 4px 16px 16px;
  animation: screenIn .2s ease both;
}

.acc-title { font-size: 11px; font-weight: 800; color: var(--green-dk); margin: 10px 0 8px; }

.feat { margin-bottom: 9px; }
.feat-top { display: flex; align-items: baseline; gap: 6px; font-size: 12px; }
.feat-name { color: var(--ink); font-weight: 700; }
.feat-count { color: var(--muted); font-size: 11px; }
.feat-dir { font-size: 10px; font-weight: 800; margin-left: auto; }
.feat-dir.up { color: var(--green); }
.feat-dir.down { color: #c79a1a; }
.feat-track { height: 6px; background: var(--track); border-radius: 999px; margin-top: 4px; overflow: hidden; }
.feat-fill { height: 100%; width: 0; border-radius: 999px; transition: width .7s cubic-bezier(.2,.8,.2,1); }
.feat-fill.up { background: var(--green); }
.feat-fill.down { background: var(--yellow); }

.quote {
  background: var(--green-tint);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 12px;
  line-height: 1.5;
}
.quote .q-score { font-size: 11px; font-weight: 800; color: var(--green); margin-top: 5px; display: block; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  background: var(--green-tint);
  color: var(--green-dk);
  border-radius: 999px;
  padding: 5px 11px;
  font-size: 11px; font-weight: 700;
}
.chip .n { color: var(--muted); font-weight: 600; }
.chip.fuzzy { background: var(--yellow-tint); color: #8a7a4a; }
.empty-note { font-size: 12px; color: var(--muted); }

/* ---------------- 공유 ---------------- */

.share-icons { display: flex; gap: 14px; }
.icon-circle {
  width: 42px; height: 42px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800;
  transition: transform .14s ease, filter .14s ease;
}
.icon-circle:hover { transform: translateY(-3px) scale(1.06); }
.icon-circle:active { transform: scale(.94); }
.icon-circle.kakao { background: #FEE500; color: #391b1b; }
.icon-circle.insta { background: radial-gradient(circle at 30% 110%, #fdf497, #fd5949 40%, #d6249f 60%, #285AEB 90%); color: #fff; }
.icon-circle.fb { background: #1877F2; color: #fff; }
.icon-circle.link { background: var(--green-tint); color: var(--green-dk); }

.overlay {
  position: fixed; inset: 0; z-index: 40;
  display: flex; align-items: center; justify-content: center;
}
.overlay[hidden] { display: none; }
.scrim {
  position: absolute; inset: 0;
  background: rgba(61,54,39,0.35);
  animation: fadeIn .2s ease both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.share-card {
  position: relative;
  width: 340px; max-width: calc(100% - 40px);
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 28px;
  padding: 26px 24px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  animation: cardIn .26s cubic-bezier(.2,.9,.3,1.15) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: scale(.92) translateY(10px); }
  to   { opacity: 1; transform: none; }
}
.share-card .headline { font-size: 19px; }
.share-card .icon-circle { width: 52px; height: 52px; font-size: 15px; }
.sheet-handle { display: none; }

/* ---------------- 토스트 ---------------- */

.toast {
  position: fixed; left: 50%; bottom: 40px; z-index: 60;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--cream);
  border-radius: 999px;
  padding: 12px 22px;
  font-size: 13px; font-weight: 700;
  box-shadow: 0 10px 30px rgba(61,54,39,.28);
  opacity: 0;
  pointer-events: none;
  transition: opacity .22s ease, transform .22s cubic-bezier(.2,.9,.3,1.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------------- 에러 ---------------- */

.err-card {
  width: 380px; max-width: 100%;
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 28px 24px;
  text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.err-msg { font-size: 13px; color: var(--ink); line-height: 1.6; word-break: break-word; }

/* ---------------- 컨페티 ---------------- */

.confetti {
  position: absolute; inset: 0; z-index: 20;
  pointer-events: none; overflow: hidden;
}
.confetti i {
  position: absolute; top: -14px;
  width: 9px; height: 14px;
  border-radius: 2px;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(720px) rotate(760deg); opacity: 0; }
}

/* ==========================================================
   모바일 (forty_scan_wireframe_board.html 시안)
   ========================================================== */

@media (max-width: 600px) {

  body { padding: 0; align-items: stretch; }

  .frame {
    max-width: none;
    min-height: 100vh;
    min-height: 100dvh;
    border: none;
    border-radius: 0;
    padding: 52px 18px calc(20px + env(safe-area-inset-bottom));
  }

  .logo-badge { top: 12px; left: 16px; }
  .back-web { top: 12px; right: 16px; font-size: 11px; padding: 5px 11px; }

  /* 세로로 긴 화면에서는 내용을 가운데로 모읍니다.
     안 그러면 정사각 영역만 늘어나서 텅 빈 초록 상자가 됩니다. */
  .screen.is-active { gap: 14px; justify-content: center; }

  .headline { font-size: 17px; }
  .sub-min, .tiny-link { font-size: 12px; }

  .pill-btn { width: 100%; height: 46px; font-size: 14px; }
  .btn-row { max-width: none; }
  .round-btn { width: 100%; height: 92px; border-radius: 26px; }

  /* 정사각 / 무대 영역은 늘어나되 너무 커지지는 않게 상한을 둡니다. */
  .square, .drop { width: 100%; height: auto; flex: 1; min-height: 160px; max-height: 380px; }
  .keyart { max-width: 78%; }

  .opt-wrap, .rank-list, .accordion, .stage, .err-card { width: 100%; }
  .opt-wrap { max-height: 400px; }

  .intent-grid { width: 100%; gap: 12px; max-height: 400px; }

  .casual-input { width: 100%; height: auto; flex: 1; min-height: 150px; max-height: 300px; }

  .stage { height: auto; flex: 1; min-height: 200px; max-height: 330px; }
  .stage-glow { width: 220px; height: 220px; }
  .stage-floor { width: 150px; }

  .gauge { width: 190px; }
  .score-num { font-size: 28px; }
  .gauge-grade { font-size: 18px; }

  .avatar.lg { width: 64px; height: 64px; font-size: 24px; }
  .who-grid { gap: 18px; }

  .loading-char { width: 150px; height: 200px; }
  .loading-copy { font-size: 14px; }

  .mini-name { width: 62px; font-size: 14px; }

  /* 공유는 중앙 모달 대신 하단 바텀시트 */
  .overlay { align-items: flex-end; }
  .share-card {
    width: 100%; max-width: none;
    border-radius: 24px 24px 0 0;
    border-bottom: none;
    padding: 14px 20px calc(24px + env(safe-area-inset-bottom));
    gap: 14px;
    animation: sheetIn .26s cubic-bezier(.2,.9,.3,1.1) both;
  }
  .share-card .headline { font-size: 15px; }
  .share-card .icon-circle { width: 44px; height: 44px; font-size: 13px; }
  .sheet-handle {
    display: block;
    width: 34px; height: 4px;
    background: #e4d8b8;
    border-radius: 999px;
  }
  @keyframes sheetIn {

  }

  .toast { bottom: 26px; width: max-content; max-width: calc(100% - 40px); }
}

@media (prefers-reduced-motion: reduce) {

  }
}

      <button class="icon-circle fb" type="button" data-soon="페이스북 공유">F</button>
      <button class="icon-circle link" type="button" data-soon="링크 복사">🔗</button>
    </div>
    <button class="tiny-link" type="button" id="share-close">닫기</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ==========================================================
   0. 상태
   ========================================================== */

const state = {
  file: null,        /* 사용자가 고른 TXT File 객체 */
  all: null,         /* POST /analyze-all 응답 전체 */
  speaker: null,     /* all.results 중 지금 보고 있는 화자 하나 */
  sentence: null,    /* POST /analyze-sentence 응답 */
  intent: null,      /* "me" | "other" | "all" */
  busy: false
};

/* 데이터가 있어야만 열 수 있는 화면입니다.
   새로고침이나 브라우저 뒤로가기로 곧장 들어오면 랜딩으로 되돌립니다. */

const NEEDS_FILE     = ["intent", "whoami", "result-all", "result-speaker"];
const NEEDS_SENTENCE = ["result-sentence"];

/* ==========================================================
   1. 등급

   임계값 20 / 40 / 60 / 80 은
   forty_scan_features.py 의 GRADES 와 반드시 같아야 합니다.

     (20,  "진성 MZ")
     (40,  "정상 범주")
     (60,  "영포티 경계")
     (80,  "MZ 코스프레 40대")
     (101, "확진 영포티")

   등급 이름과 코멘트는 여기서 만들지 않고
   서버 응답(final_grade / final_comment)을 그대로 씁니다.
   캐릭터 이미지를 고르는 데에만 구간을 씁니다.
   ========================================================== */

function gradeStep(score) {
  if (score < 20) return 1;   /* 진성 MZ */
  if (score < 40) return 2;   /* 정상 범주 */
  if (score < 60) return 3;   /* 영포티 경계 */
  if (score < 80) return 4;   /* MZ 코스프레 40대 */
  return 5;                   /* 확진 영포티 */
}

/* charImg 폴더는 static 밖에 있어서 forty_web.py 가 /charimg 로 따로 붙여 둡니다. */

function charSrc(score) {
  return "/charimg/" + gradeStep(score) + "단계.png";
}

/* 분석을 기다리는 동안 5장을 미리 받아 둡니다.
   장당 0.7~1.6MB 라서 결과 화면에서 처음 받으면 늦게 뜹니다. */

let preloaded = false;

function preloadChars() {
  if (preloaded) return;
  preloaded = true;
  for (let i = 1; i <= 5; i++) {
    const img = new Image();
    img.src = "/charimg/" + i + "단계.png";
  }
}

/* ==========================================================
   2. 화면 전환
   ========================================================== */

const frame   = document.querySelector(".frame");
const screens = {};

document.querySelectorAll(".screen").forEach(function (el) {
  screens[el.dataset.screen] = el;
});

const backBtn = document.getElementById("back");

let current = null;

function show(name) {

  /* 데이터 없이 결과 화면으로 들어오는 경우를 막습니다. */
  if (NEEDS_FILE.indexOf(name) >= 0 && !state.all) name = "landing";
  if (NEEDS_SENTENCE.indexOf(name) >= 0 && !state.sentence) name = "landing";

  /* 분석이 돌고 있지 않은데 로딩 화면에 서 있으면 영원히 안 끝납니다. */
  if (name === "loading" && !state.busy) name = "landing";

  if (!screens[name]) name = "landing";

  Object.keys(screens).forEach(function (key) {
    screens[key].classList.toggle("is-active", key === name);
  });

  current = name;
  backBtn.hidden = (name === "landing" || name === "loading");

  frame.scrollTop = 0;
  window.scrollTo({ top: 0, behavior: "auto" });
}

/* 브라우저 뒤로가기도 화면 뒤로가기로 이어집니다. */

function go(name) {
  if (name === current) return;
  history.pushState({ screen: name }, "");
  show(name);
}

/* 로딩 화면을 나갈 때 씁니다.

   결과 화면을 새 기록으로 쌓으면 결과에서 뒤로가기를 눌렀을 때
   분석이 이미 끝난 로딩 화면으로 되돌아가 영영 멈춰 있게 됩니다.
   그래서 로딩 기록을 결과로 덮어씁니다.

   landing → entry → sentence → loading
                              → (덮어쓰기) result-sentence
   결과에서 뒤로 = sentence 로 돌아갑니다. */

function goReplace(name) {
  history.replaceState({ screen: name }, "");
  show(name);
}

window.addEventListener("popstate", function (e) {
  show((e.state && e.state.screen) || "landing");
});

history.replaceState({ screen: "landing" }, "");
show("landing");

backBtn.addEventListener("click", function () { history.back(); });

/* 좌상단 FS 뱃지 — 어느 화면에서든 누르면 맨 처음(랜딩)으로.
   분석 중(로딩)에 눌러도 안전합니다. 위쪽의 fetch 콜백들이
   current !== "loading" 이면 결과를 화면에 반영하지 않고 조용히 멈춥니다. */

document.getElementById("logo").addEventListener("click", function () { go("landing"); });

/* data-go="화면이름" 이 붙은 버튼은 그 화면으로 넘어갑니다. */

document.addEventListener("click", function (e) {
  const el = e.target.closest("[data-go]");
  if (el) go(el.dataset.go);
});

/* ==========================================================
   3. 준비중 토스트

   아직 만들지 않은 기능(이미지 저장 / SNS 공유 / 개인정보 안내)은
   눌리기는 하되 안내만 띄웁니다.
   ========================================================== */

const toastEl = document.getElementById("toast");
let toastTimer = null;

function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () {
    toastEl.classList.remove("show");
  }, 2000);
}

document.addEventListener("click", function (e) {
  const el = e.target.closest("[data-soon]");
  if (el) toast(el.dataset.soon + " 기능은 준비중입니다 🙏");
});

/* ==========================================================
   4. 공유 모달 / 바텀시트

   여는 것까지는 시안대로 동작하고,
   안에 있는 아이콘 4개가 준비중 토스트를 띄웁니다.
   ========================================================== */

const shareOverlay = document.getElementById("share-overlay");

function openShare() {
  shareOverlay.hidden = false;
  document.getElementById("share-close").focus();
}

function closeShare() {
  shareOverlay.hidden = true;
}

document.getElementById("p-share").addEventListener("click", openShare);
document.getElementById("a-share").addEventListener("click", openShare);
document.getElementById("share-close").addEventListener("click", closeShare);
document.getElementById("share-scrim").addEventListener("click", closeShare);

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && !shareOverlay.hidden) closeShare();
});

/* ==========================================================
   5. 로딩 화면
   ========================================================== */

const LOADING_LINES = [
  "라떼 향 감지 중…",
  "물결표(~) 개수 세는 중…",
  "^^ 각도 재는 중…",
  "말줄임표 밀도 측정 중…",
  "'우리 때는' 출현 빈도 확인 중…",
  "느낌표 삼연타 추적 중…",
  "인생 조언 함량 계산 중…",
  "'요즘 애들' 지수 산출 중…",
  "존댓말과 반말 사이 온도 재는 중…",
  "이모티콘 세대 판별 중…",
  "감탄사 '에헤이' 검출 중…",
  "쉼표 남용 여부 대조 중…",
  "'^^;;' 방어기제 분석 중…",
  "초성체 해독 중…",
  "신조어 사전 대조 중…",
  "아재개그 위험도 평가 중…",
  "말끝 흐림 패턴 매칭 중…",
  "젊음 강조 구문 색출 중…",
  "호칭에서 나이 추정 중…",
  "최종 영포티 지수 반올림 중…"
];

const loadingCopy = document.getElementById("loading-copy");
const loadingChar = document.getElementById("loading-char");
let loadingTimer = null;

function startLoading() {
  preloadChars();

  loadingChar.src = "/charimg/" + (1 + Math.floor(Math.random() * 5)) + "단계.png";

  const order = LOADING_LINES.slice().sort(function () { return Math.random() - 0.5; });
  let i = 0;

  loadingCopy.textContent = order[0];

  clearInterval(loadingTimer);
  loadingTimer = setInterval(function () {
    loadingCopy.classList.add("fade");
    setTimeout(function () {
      i = (i + 1) % order.length;
      loadingCopy.textContent = order[i];
      loadingCopy.classList.remove("fade");
    }, 250);
  }, 1400);

  go("loading");
}

function stopLoading() {
  clearInterval(loadingTimer);
  loadingTimer = null;
}

/* ==========================================================
   6. 서버 호출
   ========================================================== */

/* FastAPI HTTPException 의 detail 은 문자열일 수도, 객체일 수도 있습니다.
   (forty_backend.py 의 화자 오류는 {message, ...} 객체를 돌려줍니다.) */

function readDetail(data, code) {
  if (!data || data.detail === undefined) return "요청에 실패했습니다. (HTTP " + code + ")";
  const d = data.detail;
  if (typeof d === "string") return d;
  if (d && typeof d === "object" && typeof d.message === "string") return d.message;
  return JSON.stringify(d);
}

const errMsg = document.getElementById("err-msg");
let errBackTo = "entry";

function showError(message, backTo) {
  stopLoading();
  errMsg.textContent = message;
  errBackTo = backTo || "entry";
  goReplace("error");
}

document.getElementById("err-retry").addEventListener("click", function () {
  go(errBackTo);
});

/* ---------------- 파일 분석 ---------------- */

/* /analyze-all 한 번이면 전 화자의 점수 / 근거 / 대표 문장이 모두 옵니다.
   그래서 "내 대화" "상대방" "전체 다 보기" 세 갈래를 이 응답 하나로 처리합니다.

   화자 1명짜리 /analyze 를 따로 부르지 않는 이유는
   그쪽이 다른 파서(load_messages)를 써서
   같은 화자인데 점수가 미세하게 달라질 수 있기 때문입니다. */

async function sendFile(file) {
  if (state.busy) return;
  state.busy = true;

  state.file = file;
  state.all = null;
  state.speaker = null;

  startLoading();

  const started = Date.now();

  const fd = new FormData();
  fd.append("file", file);

  try {
    const res = await fetch("/analyze-all", { method: "POST", body: fd });

    let data = null;
    try { data = await res.json(); } catch (_) { data = null; }

    /* 너무 빨리 끝나면 로딩 화면이 깜빡이기만 해서 최소 1.1초는 보여줍니다. */
    const wait = Math.max(0, 1100 - (Date.now() - started));
    await new Promise(function (r) { setTimeout(r, wait); });

    /* 기다리는 동안 사용자가 뒤로 가버렸으면 화면을 낚아채지 않습니다. */
    if (current !== "loading") { stopLoading(); return; }

    if (!res.ok) {
      showError(readDetail(data, res.status), "upload");
      return;
    }

    stopLoading();
    state.all = data;
    renderIntent();
    goReplace("intent");

  } catch (err) {
    if (current !== "loading") { stopLoading(); return; }
    showError("서버에 연결하지 못했습니다. (" + err.message + ")", "upload");
  } finally {
    state.busy = false;
  }
}

/* ---------------- 문장 분석 ---------------- */

async function sendSentence(text) {
  if (state.busy) return;
  state.busy = true;

  startLoading();

  const started = Date.now();

  try {
    const res = await fetch("/analyze-sentence", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    });

    let data = null;
    try { data = await res.json(); } catch (_) { data = null; }

    const wait = Math.max(0, 1100 - (Date.now() - started));
    await new Promise(function (r) { setTimeout(r, wait); });

    if (current !== "loading") { stopLoading(); return; }

    if (!res.ok) {
      showError(readDetail(data, res.status), "sentence");
      return;
    }

    stopLoading();
    state.sentence = data;
    renderSentence(data);
    goReplace("result-sentence");

  } catch (err) {
    if (current !== "loading") { stopLoading(); return; }
    showError("서버에 연결하지 못했습니다. (" + err.message + ")", "sentence");
  } finally {
    state.busy = false;
  }
}

/* ==========================================================
   7. 업로드 화면
   ========================================================== */

const drop   = document.getElementById("drop");
const picker = document.getElementById("picker");

/* dragover 에서 preventDefault 를 하지 않으면 브라우저가 파일을 그냥 열어버립니다. */

["dragenter", "dragover"].forEach(function (name) {
  drop.addEventListener(name, function (e) {
    e.preventDefault(); e.stopPropagation();
    drop.classList.add("hot");
  });
});

["dragleave", "drop"].forEach(function (name) {
  drop.addEventListener(name, function (e) {
    e.preventDefault(); e.stopPropagation();
    drop.classList.remove("hot");
  });
});

drop.addEventListener("drop", function (e) {
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if (file) sendFile(file);
});

/* 화면 바깥에 떨어뜨렸을 때도 브라우저가 파일을 열지 않도록 */
["dragover", "drop"].forEach(function (name) {
  window.addEventListener(name, function (e) {
    if (!drop.contains(e.target)) e.preventDefault();
  });
});

drop.addEventListener("click", function () { if (!state.busy) picker.click(); });
document.getElementById("pick-btn").addEventListener("click", function () {
  if (!state.busy) picker.click();
});

picker.addEventListener("change", function () {
  const file = picker.files && picker.files[0];
  if (file) sendFile(file);
  picker.value = "";   /* 같은 파일을 다시 골라도 change 가 걸리도록 */
});

/* ==========================================================
   8. 문장 화면
   ========================================================== */

const textInput = document.getElementById("text-input");

document.getElementById("read-btn").addEventListener("click", function () {
  const text = textInput.value.trim();
  if (!text) { toast("문장을 입력해주세요 ✍️"); textInput.focus(); return; }
  sendSentence(text);
});

/* Ctrl(⌘) + Enter 로도 판독 */
textInput.addEventListener("keydown", function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") document.getElementById("read-btn").click();
});

/* ==========================================================
   9. 목적 선택 / 화자 선택
   ========================================================== */

function renderIntent() {
  document.getElementById("intent-sub").textContent =
    state.all.filename + " · 메시지 " + state.all.message_count +
    "개 · 참여자 " + state.all.results.length + "명";
}

document.querySelectorAll("[data-intent]").forEach(function (el) {
  el.addEventListener("click", function () {
    state.intent = el.dataset.intent;

    if (state.intent === "all") {
      renderAll();
      go("result-all");
      return;
    }

    renderWho();
    go("whoami");
  });
});

function initial(name) {
  /* "16이도현" 처럼 숫자로 시작하는 이름이 있어서 첫 글자만 쓰면 "1" 이 됩니다.
     한글이 있으면 첫 한글 글자를 씁니다. */
  const hangul = name.match(/[가-힣]/);
  return hangul ? hangul[0] : name.charAt(0);
}

function renderWho() {
  document.getElementById("who-headline").textContent =
    state.intent === "other" ? "상대는 누구인가요?" : "당신은 누구인가요?";

  const grid = document.getElementById("who-grid");
  grid.innerHTML = "";

  state.all.results.forEach(function (r) {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "who-item";

    const av = document.createElement("div");
    av.className = "avatar lg";
    av.textContent = initial(r.speaker);

    const nm = document.createElement("div");
    nm.className = "nm";
    nm.textContent = r.speaker;

    item.appendChild(av);
    item.appendChild(nm);

    item.addEventListener("click", function () {
      state.speaker = r;
      renderSpeaker(r);
      go("result-speaker");
    });

    grid.appendChild(item);
  });
}

/* ==========================================================
   10. 결과 그리기
   ========================================================== */

const ARC_LENGTH = Math.PI * 80;   /* 반원 게이지 호의 길이 (r = 80) */

function drawGauge(arcEl, numEl, score, provisional) {

  const color = provisional ? "#b3ab97" : "#158F69";
  arcEl.setAttribute("stroke", color);
  numEl.setAttribute("fill", color);

  /* 먼저 0 으로 두었다가 다음 프레임에 목표값을 넣어야 채워지는 게 보입니다. */
  arcEl.style.transition = "none";
  arcEl.setAttribute("stroke-dasharray", ARC_LENGTH);
  arcEl.setAttribute("stroke-dashoffset", ARC_LENGTH);
  numEl.textContent = "0";

  requestAnimationFrame(function () {
    arcEl.style.transition = "";
    const ratio = Math.max(0, Math.min(100, score)) / 100;
    arcEl.setAttribute("stroke-dashoffset", ARC_LENGTH * (1 - ratio));
  });

  countUp(numEl, score);
}

function countUp(el, target) {
  const started = performance.now();
  const dur = 900;

  function step(now) {
    const t = Math.min(1, (now - started) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(target * eased);
    if (t < 1) requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}

/* 캐릭터는 다 받은 다음에 띄웁니다. 안 그러면 반쯤 그려진 채로 팝인합니다. */

function setChar(stageEl, imgEl, score, provisional) {
  imgEl.classList.remove("in");
  stageEl.classList.toggle("dim", !!provisional);

  const src = charSrc(score);
  imgEl.alt = "영포티 지수 " + Math.round(score) + "점 캐릭터";

  const show = function () { imgEl.classList.add("in"); };

  imgEl.onload = show;
  imgEl.src = src;
  if (imgEl.complete) show();
}

/* ---------------- 문장 결과 ---------------- */

function renderSentence(r) {
  drawGauge(document.getElementById("s-arc"), document.getElementById("s-score"), r.score, false);
  setChar(document.getElementById("s-stage"), document.getElementById("s-char"), r.score, false);

  document.getElementById("s-grade").textContent = r.grade;
  document.getElementById("s-comment").textContent = r.grade_comment;

  const chips = document.getElementById("s-chips");
  chips.innerHTML = "";

  if (!r.detected_features || !r.detected_features.length) {
    chips.innerHTML = '<div class="empty-note">잡힌 특징이 없습니다. 아주 담백한 문장이에요.</div>';
  } else {
    r.detected_features.forEach(function (f) {
      chips.appendChild(featureChip(f));
    });
  }

  celebrate(r.score);
}

function featureChip(f) {
  const chip = document.createElement("span");
  chip.className = "chip" + (f.is_fuzzy ? " fuzzy" : "");
  chip.innerHTML = featureLabel(f.name) +
    ' <span class="n">×' + f.count + "</span>" +
    (f.is_fuzzy ? ' <span class="n">오타 보정</span>' : "");
  return chip;
}

function featureLabel(name) {
  return escapeHtml(name.replace(/_/g, " "));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* ---------------- 화자 1명 결과 ---------------- */

function renderSpeaker(r) {
  drawGauge(document.getElementById("p-arc"), document.getElementById("p-score"), r.final_score, r.is_provisional);
  setChar(document.getElementById("p-stage"), document.getElementById("p-char"), r.final_score, r.is_provisional);

  document.getElementById("p-tag").textContent = r.speaker;

  const gradeEl = document.getElementById("p-grade");
  gradeEl.textContent = r.final_grade;
  gradeEl.classList.toggle("prov", !!r.is_provisional);

  document.getElementById("p-comment").textContent = r.final_comment;

  const meta = document.getElementById("p-meta");
  meta.innerHTML = "";

  if (r.is_provisional) {
    /* 메시지가 너무 적어 판정을 보류한 화자입니다.
       초록이나 빨강을 붙이면 판정이 난 것처럼 읽히기 때문에 회색으로 둡니다. */
    meta.innerHTML = '<span class="prov-badge">표본 부족 · 판정 보류</span> ' +
      "메시지 " + r.message_count + "개";
  } else {
    meta.textContent =
      "메시지 " + r.message_count + "개 · 신뢰도 " + Math.round(r.reliability * 100) + "%";
  }

  renderEvidence(document.getElementById("p-acc"), r);

  if (!r.is_provisional) celebrate(r.final_score);
}

/* 근거 특징 + 대표 문장 */

function renderEvidence(box, r) {
  box.innerHTML = "";

  const feats = r.top_features || [];

  if (feats.length) {
    const t = document.createElement("div");
    t.className = "acc-title";
    /* 계수가 음수인 특징(초성체 / 신조어 등)은 점수를 오히려 내리기 때문에
       "끌어올린 특징" 이라고 뭉뚱그리면 방향이 반대로 읽힙니다. */
    t.textContent = "판단 근거";
    box.appendChild(t);

    const max = Math.max.apply(null, feats.map(function (f) { return Math.abs(f.contribution); }));

    feats.forEach(function (f) {
      const up = f.contribution >= 0;
      const pct = max > 0 ? Math.max(4, Math.abs(f.contribution) / max * 100) : 0;

      const row = document.createElement("div");
      row.className = "feat";
      row.innerHTML =
        '<div class="feat-top">' +
          '<span class="feat-name">' + featureLabel(f.name) + "</span>" +
          '<span class="feat-count">' + f.count + "회" + (f.is_fuzzy ? " · 오타 보정" : "") + "</span>" +
          '<span class="feat-dir ' + (up ? "up" : "down") + '">' + (up ? "▲ 지수 올림" : "▼ 지수 낮춤") + "</span>" +
        "</div>" +
        '<div class="feat-track"><div class="feat-fill ' + (up ? "up" : "down") + '"></div></div>';

      box.appendChild(row);

      const fill = row.querySelector(".feat-fill");
      requestAnimationFrame(function () { fill.style.width = pct + "%"; });
    });
  }

  const quotes = r.top_sentences || [];

  if (quotes.length) {
    const t2 = document.createElement("div");
    t2.className = "acc-title";
    t2.textContent = "지수가 높았던 문장";
    box.appendChild(t2);

    quotes.forEach(function (q) {
      const el = document.createElement("div");
      el.className = "quote";
      el.innerHTML = escapeHtml(q.text) +
        '<span class="q-score">' + Math.round(q.score) + "점 · " + escapeHtml(q.grade) + "</span>";
      box.appendChild(el);
    });
  }

  if (!feats.length && !quotes.length) {
    box.innerHTML = '<div class="empty-note">근거로 삼을 만한 특징이 잡히지 않았습니다.</div>';
  }
}

/* ---------------- 전체 순위 ---------------- */

function renderAll() {
  const results = state.all.results;
  const top = results[0];

  document.getElementById("a-tag").textContent = "1위 · " + top.speaker;
  setChar(document.getElementById("a-stage"), document.getElementById("a-char"),
          top.final_score, top.is_provisional);

  const list = document.getElementById("rank-list");
  list.innerHTML = "";

  results.forEach(function (r, i) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "mini-row";
    row.style.animationDelay = (i * 60) + "ms";

    row.innerHTML =
      '<span class="mini-rank">' + (i + 1) + "</span>" +
      '<span class="avatar' + (r.is_provisional ? " dim" : "") + '">' +
        '<img src="' + charSrc(r.final_score) + '" alt="">' +
      "</span>" +
      '<span class="mini-name">' + escapeHtml(r.speaker) + "</span>" +
      '<span class="mini-bar-track"><span class="mini-bar-fill' +
        (r.is_provisional ? " prov" : "") + '"></span></span>' +
      '<span class="mini-score">' + Math.round(r.final_score) + "</span>";

    row.addEventListener("click", function () {
      state.speaker = r;
      renderSpeaker(r);
      go("result-speaker");
    });

    list.appendChild(row);

    const fill = row.querySelector(".mini-bar-fill");
    setTimeout(function () {
      fill.style.width = Math.max(2, Math.min(100, r.final_score)) + "%";
    }, 80 + i * 60);
  });

  const provCount = results.filter(function (r) { return r.is_provisional; }).length;

  document.getElementById("a-summary").textContent =
    "이름을 누르면 자세히 볼 수 있어요" +
    (provCount ? " · 표본 부족 " + provCount + "명은 판정 보류" : "");
}

/* ==========================================================
   11. 확진 영포티 컨페티

   5단계일 때만 한 번 뿌립니다.
   ========================================================== */

const confettiBox = document.getElementById("confetti");

function celebrate(score) {
  if (gradeStep(score) < 5) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  confettiBox.innerHTML = "";

  const colors = ["#FEC926", "#158F69", "#FEE500", "#7fae9c"];

  for (let i = 0; i < 34; i++) {
    const bit = document.createElement("i");
    bit.style.left = Math.random() * 100 + "%";
    bit.style.background = colors[i % colors.length];
    bit.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
    bit.style.animationDelay = (Math.random() * 0.5) + "s";
    bit.style.opacity = 0.55 + Math.random() * 0.45;
    confettiBox.appendChild(bit);
  }

  setTimeout(function () { confettiBox.innerHTML = ""; }, 3600);
}
